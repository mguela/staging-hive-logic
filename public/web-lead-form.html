<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request an estimate — GH Group</title>
<!--
  The website enquiry form. Posts to /api/web-lead, which creates the lead in
  HiveLogic and lands it in Sales > Leads.

  Two ways to use it:
    1. Drop it on the site in an iframe:
         <iframe src="https://<your-hivelogic-domain>/web-lead-form.html"
                 style="width:100%;max-width:560px;height:760px;border:0"
                 title="Request an estimate"></iframe>
    2. Or copy the <form> below into an existing page. It needs no script tags
       beyond the one at the bottom and no stylesheet beyond the one here.
       If it is served from a different domain than the API, that domain has to
       be listed in WEB_LEAD_ALLOWED_ORIGINS or the browser will block the post.

  The `company_website` field is a honeypot: hidden from people, filled by bots,
  and any submission carrying it is silently discarded. Do not remove it, do not
  give it a visible label, and do not rename it without changing the server.
-->
<style>
  :root {
    --ink: #1d2530; --mut: #69748a; --line: #dfe4ec; --green: #1B7A50;
    --bg: #ffffff; --field: #ffffff; --err: #c65b4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8ecf3; --mut: #9aa5b8; --line: #333c4c; --green: #4bb37e;
      --bg: #161c26; --field: #1d2530;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--mut); font-size: 13.5px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
          text-transform: uppercase; color: var(--mut); margin: 0 0 5px; }
  .req::after { content: " *"; color: var(--err); }
  input, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--field); color: inherit; font: inherit; font-size: 15px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
  textarea { min-height: 110px; resize: vertical; }
  .row { margin-bottom: 15px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
  button {
    width: 100%; padding: 13px 0; border: 0; border-radius: 10px;
    background: var(--green); color: #fff; font: inherit; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 14px; font-weight: 600; display: none; }
  .msg.show { display: block; }
  .msg.bad { color: var(--err); }
  .msg.good { color: var(--green); }
  .note { color: var(--mut); font-size: 12px; margin-top: 12px; }
  /* The honeypot. Hidden every way a browser can hide something, because a
     careless bot checks one or two of them. Not `display:none` alone -- some
     bots skip those and fill the rest, which would defeat the whole trick. */
  .hp {
    position: absolute !important; left: -9999px !important; top: auto !important;
    width: 1px !important; height: 1px !important; overflow: hidden !important;
    opacity: 0 !important; pointer-events: none !important;
  }
</style>

<div class="wrap">
  <h1>Tell us about the job</h1>
  <p class="sub">Send this over and someone from the office will get back to you.</p>

  <form id="wlf" novalidate>
    <div class="row">
      <label for="wlf-name" class="req">Your name</label>
      <input id="wlf-name" name="name" autocomplete="name" maxlength="120" required>
    </div>

    <div class="row two">
      <div>
        <label for="wlf-phone">Phone</label>
        <input id="wlf-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" placeholder="(914) 555-0100">
      </div>
      <div>
        <label for="wlf-email">Email</label>
        <input id="wlf-email" name="email" type="email" autocomplete="email" maxlength="200" placeholder="you@email.com">
      </div>
    </div>

    <div class="row two">
      <div>
        <label for="wlf-address">Where is the work?</label>
        <input id="wlf-address" name="address" autocomplete="street-address" maxlength="300" placeholder="Street, town, state">
      </div>
      <div>
        <label for="wlf-unit">Apt / suite / unit</label>
        <input id="wlf-unit" name="unit" autocomplete="address-line2" maxlength="30" placeholder="e.g. 2B">
      </div>
    </div>

    <div class="row">
      <label for="wlf-need">What do you need done?</label>
      <textarea id="wlf-need" name="need" maxlength="4000" placeholder="As much or as little detail as you like."></textarea>
    </div>

    <!-- Honeypot. Leave it exactly as it is. -->
    <div class="hp" aria-hidden="true">
      <label for="wlf-cw">Do not fill this in</label>
      <input id="wlf-cw" name="company_website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="wlf-go">Send it</button>
    <div class="msg" id="wlf-msg" role="status" aria-live="polite"></div>
    <p class="note">We need your name, and either a phone number or an email address, so we can reply.</p>
  </form>
</div>

<script>
(function () {
  // Same-origin by default. Point this at the HiveLogic domain if the form is
  // hosted somewhere else -- and add that somewhere else to
  // WEB_LEAD_ALLOWED_ORIGINS on the server, or the browser blocks the post.
  var ENDPOINT = '/api/web-lead';

  var form = document.getElementById('wlf');
  var btn = document.getElementById('wlf-go');
  var msg = document.getElementById('wlf-msg');

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'msg show ' + (kind || '');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var body = {
      name: form.name.value,
      phone: form.phone.value,
      email: form.email.value,
      address: form.address.value,
      unit: form.unit.value,
      need: form.need.value,
      company_website: form.company_website.value,
      source: 'Website'
    };

    // Checked here as well as on the server, so the person is told immediately
    // rather than after a round trip. The server check is the one that counts.
    if (!body.name.trim() || (!body.phone.trim() && !body.email.trim())) {
      say('Please give us your name, and either a phone number or an email address.', 'bad');
      return;
    }

    btn.disabled = true;
    say('Sending…', '');

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; });
    }).then(function (d) {
      if (d && d.ok) {
        form.style.display = 'none';
        say(d.message || 'Thanks — we have got it and will be in touch.', 'good');
        return;
      }
      // The form stays on screen with everything still in it. Wiping what
      // someone typed because the send failed is how an enquiry is lost twice.
      btn.disabled = false;
      say((d && d.error) || 'That did not go through. Please try again, or call us.', 'bad');
    }).catch(function () {
      btn.disabled = false;
      say('That did not go through — check your connection and try again, or call us.', 'bad');
    });
  });
})();
</script>
