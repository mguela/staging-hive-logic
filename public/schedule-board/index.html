<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HiveLogic Schedule Lab</title>
<!-- Mapbox GL — real 3D map behind the schedule. Public (pk.) token is safe to embed
     in client code; scope it with URL restrictions in your Mapbox account for production. -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script>window.HL_MAPBOX_TOKEN='pk.eyJ1IjoiY3NrNTM5IiwiYSI6ImNtc3Q2cG9hZjAzMGkyenBvd2p3OGllZ2UifQ.kBk4Q8WRNNAyuhqa3fNI7A';</script>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#1d2530; --mut:#69748a; --line:#e3e8f0;
  --rail:#fbfcfe; --grid:#eef1f7; --gridhr:#e6eaf2; --now:#d9463b;
  --chip:#eef2f8; --accent:#2b3f8c; --ok:#1B7A50; --warn:#C65B4E; --amb:#B7791F;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);
  --hr-w:94px; --rail-w:190px; --row-h:88px; --day-start:6; --day-end:19;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1420; --panel:#161c2a; --ink:#e7ecf5; --mut:#93a0b8; --line:#26303f;
    --rail:#131a27; --grid:#1a2130; --gridhr:#212a3b; --chip:#1e2637; --accent:#6f9bea; }
}
:root[data-theme="dark"]{ --bg:#0f1420; --panel:#161c2a; --ink:#e7ecf5; --mut:#93a0b8; --line:#26303f; --rail:#131a27; --grid:#1a2130; --gridhr:#212a3b; --chip:#1e2637; --accent:#6f9bea; }
:root[data-theme="light"]{ --bg:#f4f6fa; --panel:#fff; --ink:#1d2530; --mut:#69748a; --line:#e3e8f0; --rail:#fbfcfe; --grid:#eef1f7; --gridhr:#e6eaf2; --chip:#eef2f8; --accent:#2b3f8c; }
/* Board follows HiveLogic's light/dark (set from the parent); its own theme toggle is hidden. */
#themeBtn{display:none!important}
/* chained crew avatars on a job card */
.crewrow{display:flex;align-items:center;gap:3px;margin-top:3px}
.cwav{width:16px;height:16px;border-radius:50%;color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--panel);margin-left:-4px;flex-shrink:0}
.cwav:first-child{margin-left:0}
.cwav.lead{box-shadow:0 0 0 1.5px var(--accent)}
.cwn{font-size:9.5px;font-weight:700;color:var(--mut);margin-left:4px}
/* A chained secondary's own row: deliberately quiet — the real job card sits on
   the lead's row. This exists only so a chained person doesn't read as free. */
.job.chained{background:transparent!important;border:1px dashed var(--line)!important;border-left-color:var(--line)!important;
  box-shadow:none!important;opacity:.7;padding:2px 6px;display:flex;align-items:center;cursor:default;
  /* a thin strip, not a full-height card: it marks the row as spoken for
     without competing with the real job on the lead's row */
  height:22px;top:calc((var(--row-h) - 22px) / 2)}
.job.chained small{font-size:9.5px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* dispatch's queue of techs who peeled themselves off a job */
.rechain{margin:8px 0;padding:8px 10px;border:1px solid #A9772E;border-radius:8px;background:rgba(169,119,46,.08)}
.rechain b{display:block;font-size:11px;margin-bottom:4px}
.rcrow{display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0;flex-wrap:wrap}
/* live status pill next to a crew name in the rail */
.livep{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:20px;letter-spacing:.02em}
.livep.on_site{background:rgba(27,122,80,.16);color:#1B7A50}
.livep.en_route{background:rgba(47,93,138,.16);color:#2f5d8a}
.livep.at_shop{background:rgba(93,101,123,.16);color:#5D657B}
.livep.materials{background:rgba(169,119,46,.16);color:#A9772E}
.livep.clocked{background:rgba(43,63,140,.14);color:var(--accent)}
.livep.idle{background:var(--chip);color:var(--mut)}
.livep .d{width:6px;height:6px;border-radius:50%;background:currentColor}
/* crew + clock panel on the job sheet */
.crewmgr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cmw{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px}
.cmw .cwav{margin:0}
.cmx{border:none;background:transparent;color:var(--warn);font-weight:900;cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.crewadd{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.crewadd select{flex:1}
.clockrow{display:flex;gap:8px;flex-wrap:wrap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* Lab banner */
.labbar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(90deg,#1f6f8b,#b7791f);color:#fff;font-weight:800;font-size:11px;letter-spacing:.03em}
.labbar .dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.labbar small{font-weight:600;opacity:.9;letter-spacing:0}

/* Header */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.brand .hx{color:var(--accent)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav b{min-width:150px;text-align:center;font-size:13px;font-weight:800}
.today-pill{color:var(--ok);font-weight:700;font-size:11px;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:11px}
.btn.icon{padding:6px 10px;font-weight:800}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.freeze-on{border-color:var(--ok);color:var(--ok)}
.btn.freeze-off{border-color:var(--warn);color:var(--warn)}
.btn.has{border-color:var(--warn);color:var(--warn)}
.reqn{background:var(--warn);color:#fff;font-size:9px;font-weight:900;padding:0 5px;border-radius:20px;margin-left:3px}
.spacer{flex:1}
select.divf{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700}

/* Summary strip */
.sumstrip{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel);align-items:center}
.attnlabel{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--warn);align-self:center;margin-right:2px}
.stat.sub{opacity:.6;background:transparent;border-color:transparent}
.stat.sub b{font-size:13px}
.stat{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12px}
.stat b{font-size:15px}
.stat.click{cursor:pointer}
.stat.click:hover{border-color:var(--accent)}
.stat.warn b{color:var(--warn)}
.stat .lbl{color:var(--mut);font-weight:600}

/* People chips */
.pplbar{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
.pchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 10px 4px 4px;font-size:11px;font-weight:700}
.pchip .av{width:22px;height:22px;border-radius:50%;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pchip.off{opacity:.4}
.pchip small{color:var(--mut);font-weight:600}

/* Board */
.wrap{display:flex;gap:0;align-items:flex-start;padding:0;position:relative}
/* SimCity-style live service-area map, dimmed behind the Day board. Fixed to the
   viewport (does not scroll with the timeline); shows through the transparent lane
   gaps between the opaque appointment cards. */
#mapbg{position:absolute;inset:0;right:var(--side-w,0px);max-height:var(--board-h,72vh);z-index:0;pointer-events:none;opacity:0;transition:opacity .45s ease;overflow:hidden}
#mapbg.on{opacity:.72}
/* With a map underneath, hairline borders and flat cards disappear into it.
   Scoped to body.map-under so the plain board is untouched. */
body.map-under .wkrow{border-bottom-color:var(--gridhr)}
body.map-under .wkcell{border-left-color:var(--gridhr)}
body.map-under .wkhd{box-shadow:0 2px 8px rgba(20,30,50,.16)}
body.map-under .wkchip,body.map-under .job{box-shadow:0 3px 10px rgba(20,30,50,.30);border:1px solid var(--line)}
body.map-under .wkchip{border-left-width:3px}
body.map-under .lane{background-color:color-mix(in srgb,var(--bg) 24%,transparent)}
body.map-under .rc,body.map-under .crew{backdrop-filter:saturate(1.2)}
/* Controls for the background map. The map itself stays pointer-events:none so
   it can never swallow a click meant for the calendar; only this cluster is
   clickable. */
#mapbgctl{position:absolute;top:8px;right:calc(var(--side-w,0px) + 8px);z-index:6;display:none;flex-direction:column;gap:4px;pointer-events:auto}
body.map-under #mapbgctl{display:flex}
#mapbgctl button{width:27px;height:27px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:13px;font-weight:800;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:0}
#mapbgctl button:hover{background:var(--chip)}
#mapbgtilt{position:absolute;right:calc(var(--side-w,0px) + 8px);top:132px;z-index:6;display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 8px;box-shadow:var(--shadow);pointer-events:auto}
body.map-under #mapbgtilt{display:flex}
#mapbgtilt span{font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--mut)}
#mapbgtilt input{width:74px;accent-color:var(--accent);cursor:pointer}
#mapbgtilt b{font-size:9.5px;font-weight:800;color:var(--mut);min-width:24px;text-align:right}
#mapbg.prompt{opacity:1;pointer-events:auto;background:var(--bg)}
#mapbg svg{width:100%;height:100%;display:block}
#mapbg .mapboxgl-map{width:100%;height:100%}
/* tilt slider — neither NavigationControl ships a pitch control, and right-drag
   to tilt is not discoverable, so this is the visible one. */
.maptilt{position:absolute;left:10px;bottom:10px;z-index:6;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 9px;box-shadow:var(--shadow)}
.maptilt span{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--mut)}
.maptilt input{width:96px;accent-color:var(--accent);cursor:pointer}
.maptilt b{font-size:10px;font-weight:800;color:var(--mut);min-width:26px;text-align:right}
#maploading{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--rail);color:var(--mut);font-size:12px;font-weight:700}
#maploading .sp{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:mlspin .8s linear infinite}
@keyframes mlspin{to{transform:rotate(360deg)}}
/* full interactive 3D map on the Map tab */
.mbboard{position:relative;width:100%;height:72vh;min-height:420px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mbboard .mapboxgl-map{width:100%;height:100%}
/* moving crew truck marker on the real map */
.mbtruck{width:26px;height:26px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);letter-spacing:.02em}
.mbtruck.moving{animation:mbpulse 1.3s ease-out infinite}
@keyframes mbpulse{0%{box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 0 14px rgba(255,255,255,0)}}
/* job pin on the real map (readiness-colored); click → Street View */
.mbjob{width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.55)}
.mbjob:hover{transform:scale(1.35);transition:transform .12s}
/* Hover detail on a map pin. Both map libraries are in play here -- Mapbox when
   a token is present, MapLibre when it is not -- and they use different class
   prefixes for the same popup, so every rule is written for both. The default
   popup is a white card with dark text, which reads as a hole punched in the
   board once it is in dark mode; these follow the board's own tokens instead. */
.mbpop .mapboxgl-popup-content,.mbpop .maplibregl-popup-content{
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;box-shadow:var(--shadow);font-size:12px;line-height:1.45}
.mbpop .mapboxgl-popup-tip,.mbpop .maplibregl-popup-tip{border-top-color:var(--panel);border-bottom-color:var(--panel)}
.mbpop-b b{font-size:12.5px}
.mbpop-b hr{border:none;border-top:1px solid var(--line);margin:6px 0}
.mbpop-s{color:var(--mut);font-weight:600}
.mbpop-h{margin-top:6px;font-size:10px;font-weight:800;color:var(--accent)}
.labtn{margin-top:8px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}
.labtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
/* clickable crew rail → tech status sheet */
.rail{cursor:pointer}
.histchip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:4px 9px;margin:0 5px 5px 0;cursor:pointer}
.histchip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
/* "Look around" Street View modal */
.lamodal{position:fixed;inset:0;z-index:120;background:rgba(8,12,20,.62);display:flex;align-items:center;justify-content:center;padding:24px}
.lamodal.hidden{display:none}
.labox{width:min(960px,95vw);height:min(640px,88vh);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.lahd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}
.labody{position:relative;flex:1;background:var(--chip)}
.lamsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px;padding:24px;line-height:1.5}
/* one-time Mapbox token prompt */
.tokprompt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.tp-card{max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px}
.tp-h{font-size:15px;font-weight:800;margin-bottom:8px;color:var(--ink)}
.tp-card p{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0 0 12px}
.tp-card code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:11px}
.tp-card input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);box-sizing:border-box}
.tp-card input.bad{border-color:var(--warn)}
.tp-row{display:flex;align-items:center;gap:14px;margin-top:12px}
.tp-row a{font-size:12px;color:var(--accent);font-weight:700;text-decoration:none}
.tp-note{font-size:10.5px;color:var(--mut);margin-top:12px;line-height:1.4}
.tp-err{font-size:11.5px;color:var(--warn);background:rgba(198,91,78,.1);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.boardscroll{flex:1;overflow-x:auto;overflow-y:auto;max-height:var(--board-h,72vh);position:relative;z-index:1;background:transparent;overscroll-behavior:contain}
.board{position:relative}
#mapBgBtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.timehdr{display:flex;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(20,30,50,.10);background:var(--panel);border-bottom:1px solid var(--line)}
.timehdr .railhdr{min-width:var(--rail-w);width:var(--rail-w);position:sticky;left:0;z-index:21;background:var(--panel);border-right:1px solid var(--line);padding:8px 12px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;display:flex;align-items:center}
.hrslot{width:var(--hr-w);min-width:var(--hr-w);text-align:left;padding:8px 0 8px 6px;font-size:11px;font-weight:700;color:var(--mut);border-left:1px solid var(--grid)}
.row{display:flex;position:relative;border-bottom:1px solid var(--line);height:var(--row-h)}
.row:hover .rail{background:var(--grid)}
.rail{min-width:var(--rail-w);width:var(--rail-w);position:sticky;left:0;z-index:15;background:var(--rail);border-right:1px solid var(--line);padding:7px 10px;display:flex;align-items:center;gap:9px}
.rail .av{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rail .who{min-width:0;flex:1}
.rail .who b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .who .sub{font-size:9.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px}
.live{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:20px;letter-spacing:.02em}
.live.onsite{background:rgba(27,122,80,.14);color:var(--ok)}
.live.enroute{background:rgba(43,63,140,.14);color:var(--accent)}
.live.available{background:var(--chip);color:var(--mut)}
.utilbar{height:4px;border-radius:3px;background:var(--grid);margin-top:4px;overflow:hidden}
.utilbar i{display:block;height:100%;background:var(--ok)}
.utilbar.over i{background:var(--warn)}
.lane{position:relative;flex:1;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(var(--hr-w) - 1px),var(--grid) calc(var(--hr-w) - 1px),var(--grid) var(--hr-w))}
.lane.drop{background-color:rgba(43,63,140,.06)}
.dayempty{position:sticky;left:0;z-index:14;width:max-content;max-width:calc(100vw - 40px);margin:10px;padding:9px 14px;background:var(--chip);border:1px dashed var(--line);border-radius:9px;color:var(--mut);font-size:12px;font-weight:700}
.dayempty span{font-weight:600;opacity:.8}

/* Job blocks */
/* Readability: light tint + dark ink + saturated left edge (research-backed; high contrast) */
.job{position:absolute;top:6px;height:calc(var(--row-h) - 14px);border-radius:8px;padding:6px 9px;color:var(--ink);overflow:hidden;cursor:grab;box-shadow:0 1px 2px rgba(20,30,50,.08);border:1px solid var(--line);border-left:4px solid var(--mut);user-select:none}
.job:active{cursor:grabbing}
.job b{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.job small{font-size:11px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;line-height:1.15}
.job .tt{font-size:10px;color:var(--mut);font-weight:700}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.io{font-size:13px;vertical-align:-1px}
.job.dragging{opacity:.35}
.job .pin{position:absolute;top:4px;right:5px;font-size:13px}
.job.done{opacity:.5}
.job.conflict{outline:2px solid var(--warn);outline-offset:-1px}
.job.unconfirmed{border-left-style:dashed}
/* v2: Jobber (locked/read-only) vs HiveLogic (native) */
.job.jobber{cursor:not-allowed;background-image:repeating-linear-gradient(45deg,rgba(120,130,150,.10),rgba(120,130,150,.10) 6px,transparent 6px,transparent 12px)}
.job.jobber::after{content:"🔒";position:absolute;top:4px;left:6px;font-size:12px;opacity:.9}
.job.jobber b{padding-left:17px}
.job.proposed{border-left-style:dashed}
.job .plabel{position:absolute;bottom:2px;left:6px;font-size:7.5px;font-weight:900;letter-spacing:.06em;background:rgba(183,121,31,.9);color:#fff;padding:0 4px;border-radius:3px}
.srcpill{display:inline-flex;align-items:center;gap:3px;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:20px;text-transform:uppercase}
.srcpill.jobber{background:rgba(120,130,150,.18);color:var(--mut)}
.srcpill.hivelogic{background:rgba(43,63,140,.14);color:var(--accent)}
.dials{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dial{display:flex;flex-direction:column;gap:2px}
.dial label{font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-left:2px}
.job .cf{position:absolute;bottom:4px;right:6px;font-size:14px;font-weight:900}
.kind{display:inline-block;font-size:12px;font-weight:800;padding:0 5px;border-radius:4px;background:var(--chip);color:var(--ink);margin-right:4px}
.cfbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px}
.cfbadge.ok{background:rgba(27,122,80,.14);color:var(--ok)}
.cfbadge.no{background:rgba(183,121,31,.16);color:var(--amb)}
.cfbadge.cx{background:rgba(198,91,78,.14);color:var(--warn)}
.remind{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.remind .rr{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 9px;border:1px solid var(--line);border-radius:8px}
.remind .rr .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.remind .rr.off .dot{background:var(--line)}
.remind .rr .st{margin-left:auto;font-size:10px;font-weight:700;color:var(--mut)}
.policybox{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--ink);margin-top:8px}
.policybox b{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.toggle{position:relative;width:36px;height:20px;border-radius:20px;background:var(--line);cursor:pointer;flex-shrink:0;transition:background .15s}
.toggle.on{background:var(--ok)}
.toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on i{left:18px}
.subview{display:flex;flex-direction:column;gap:10px}
.subcard{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--panel)}
.subcard b{font-size:13px}
.subcard .sd{font-size:11px;color:var(--mut);margin-top:2px}
.confzone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(198,91,78,.22),rgba(198,91,78,.22) 5px,transparent 5px,transparent 10px);pointer-events:none;border-left:1px dashed var(--warn);border-right:1px dashed var(--warn)}
.ghost{position:absolute;top:6px;height:calc(var(--row-h) - 14px);border-radius:8px;border:2px dashed var(--accent);background:rgba(43,63,140,.1);pointer-events:none;font-size:10px;font-weight:800;color:var(--accent);display:flex;align-items:center;justify-content:center;z-index:9}
.ghost.bad{border-color:var(--warn);background:rgba(198,91,78,.12);color:var(--warn)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:12;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.nowflag{position:absolute;top:2px;transform:translateX(-50%);background:var(--now);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;z-index:22;white-space:nowrap}

/* Unassigned panel */
.unpanel{width:280px;min-width:280px;border-left:1px solid var(--line);background:var(--panel);align-self:stretch;display:none;flex-direction:column;max-height:calc(100vh - 120px);position:sticky;top:0}
.unpanel.open{display:flex}
.unhd{padding:11px 13px;border-bottom:1px solid var(--line);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:space-between}
.unlist{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.uncard{border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:9px;padding:9px 10px;background:var(--panel);cursor:grab}
.uncard:active{cursor:grabbing}
.uncard b{font-size:12px;display:block}
.uncard .meta{font-size:10.5px;color:var(--mut);margin-top:2px}
.uncard .why{font-size:10px;margin-top:5px;color:var(--warn);font-weight:700}
.uncard .pri{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:20px;background:var(--chip);color:var(--mut)}

/* Legend */
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:10.5px;color:var(--mut);align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* Modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,32,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.on{display:flex}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:420px;width:100%;overflow:hidden}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:15px}
.modal .mh .k{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin-bottom:3px}
.modal .mb{padding:14px 16px;font-size:12.5px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.diff{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;margin:8px 0;font-size:12px}
.diff .lab{color:var(--mut);font-weight:700}
.diff .from{color:var(--warn);text-decoration:line-through;opacity:.8}
.diff .to{color:var(--ok);font-weight:800}
.warnbox{background:rgba(198,91,78,.1);border:1px solid rgba(198,91,78,.3);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:11.5px;font-weight:600;margin-top:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.field{margin:10px 0}
.field label{display:block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.field select,.field input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px;font-size:13px}

/* Toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#20293c;color:#fff;padding:11px 16px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:70;display:none;align-items:center;gap:12px;max-width:92vw}
.toast.on{display:flex}
.toast a{color:#8fb3ff;font-weight:800;text-decoration:underline;cursor:pointer;white-space:nowrap}

/* Job detail popover actions */
.actrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* view tabs */
.viewtabs{display:flex;gap:3px;background:var(--chip);padding:3px;border-radius:11px}
.vt{border:none;background:transparent;color:var(--mut);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800}
.vt.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}

/* week grid */
.wk{min-width:760px}
.wkhd{display:grid;grid-template-columns:var(--rail-w) repeat(7,1fr);position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.wkhd .rc{position:sticky;left:0;background:var(--panel);border-right:1px solid var(--line);padding:9px 12px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.wkhd .dc{padding:8px 6px;text-align:center;font-size:11px;font-weight:800;color:var(--mut);border-left:1px solid var(--grid)}
.wkhd .dc.today{color:var(--accent)}
.wkhd .dc b{display:block;font-size:15px;color:var(--ink)}
.wkrow{display:grid;grid-template-columns:var(--rail-w) repeat(7,1fr);border-bottom:1px solid var(--line);min-height:64px}
.wkrow .rc{position:sticky;left:0;z-index:5;background:var(--rail);border-right:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px}
.wkrow .rc .av{width:26px;height:26px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wkcell{border-left:1px solid var(--grid);padding:5px;display:flex;flex-direction:column;gap:4px}
.wkcell.today{background:rgba(43,63,140,.04)}
.wkchip{border-radius:6px;padding:4px 7px;color:var(--ink);font-size:11px;font-weight:700;line-height:1.3;cursor:pointer;overflow:hidden;border-left:3px solid var(--mut)}
.wkchip small{display:block;color:var(--mut);font-weight:600;font-size:10px}

/* month grid */
.mo{max-width:1000px}
.modow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.modow span{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--mut);text-align:center;text-transform:uppercase}
.mogrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{min-height:96px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:6px;cursor:pointer}
.mcell.off{background:transparent;border:none;cursor:default}
.mcell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mcell .mn{font-size:11px;font-weight:800;color:var(--mut);margin-bottom:4px}
.mcell.today .mn{color:var(--accent)}
.mchip{border-radius:5px;padding:2px 6px;color:var(--ink);font-size:10.5px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--mut)}
.mmore{font-size:9.5px;color:var(--mut);font-weight:700}

/* gantt */
.gt{min-width:900px}
.gthd{display:grid;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.gthd .glabel,.gtrow .glabel{min-width:230px;width:230px;position:sticky;left:0;z-index:5;background:var(--panel);border-right:1px solid var(--line);padding:8px 12px}
.gtrow .glabel{background:var(--rail)}
.gthd .gday{text-align:center;font-size:10px;font-weight:800;color:var(--mut);padding:8px 0;border-left:1px solid var(--grid)}
.gthd .gday.we{background:var(--grid)}
.gthd .gday b{display:block;font-size:13px;color:var(--ink)}
.gtrow{display:flex;border-bottom:1px solid var(--line);min-height:56px;position:relative}
.gtrow.focus{background:rgba(43,63,140,.06)}
.gtrow.focus .glabel{box-shadow:inset 3px 0 0 var(--accent)}
.gtrow .glabel:hover b{color:var(--accent)}
.divdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:-1px;margin-right:3px}
/* v3: readiness, control mode, scenario, effective-event */
.modesel{font-weight:800}
.rdy{font-size:10.5px;font-weight:800;letter-spacing:.01em;display:block;margin-top:3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdy.ready{color:var(--mut)}
.rdy.at_risk{color:var(--amb)}
.rdy.blocked{color:var(--warn)}
.job.blocked{border-left-color:var(--warn)!important}
.job.at_risk{}
.rpill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px}
.rpill.ready{background:rgba(27,122,80,.14);color:var(--ok)}
.rpill.at_risk{background:rgba(183,121,31,.16);color:var(--amb)}
.rpill.blocked{background:rgba(198,91,78,.14);color:var(--warn)}
.propchip{position:absolute;bottom:2px;right:5px;font-size:7.5px;font-weight:900;letter-spacing:.04em;background:rgba(43,63,140,.9);color:#fff;padding:0 4px;border-radius:3px}
.reinabar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(90deg,#0e5f6e,#1590a3);color:#fff;font-size:12.5px;font-weight:600}
.reinabar .hx{font-weight:900}
.reinabar b{font-weight:900}
.reinabar .sp{margin-left:auto;display:flex;gap:8px}
.reinabar .btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:800}
.wxrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
.wxrow.today{border-color:var(--accent)}
.wxrow .wxi{font-size:20px}
.wxrow .wxd{font-weight:800;min-width:70px}
.wxrow .wxr{margin-left:auto;font-weight:800}
.wxrow .wxr.hi{color:var(--warn)} .wxrow .wxr.md{color:var(--amb)} .wxrow .wxr.lo{color:var(--ok)}
.expo{font-size:9px;opacity:.9}
.hrhead{display:flex;align-items:center;gap:8px;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:0 0 5px;border-bottom:1px solid var(--line);margin-bottom:5px}
.hourly{display:flex;flex-direction:column;gap:5px;max-height:50vh;overflow-y:auto}
.hrrow{display:flex;align-items:center;gap:8px;font-size:11.5px}
.hrt{min-width:40px;font-weight:700;color:var(--mut)}
.hri{width:18px;text-align:center}
.hrp{flex:1;height:11px;background:var(--grid);border-radius:6px;overflow:hidden}
.hrbar{display:block;height:100%;border-radius:6px}
.hrv{min-width:36px;text-align:right;font-weight:800}
.hrtemp{min-width:38px;text-align:right;color:var(--mut);font-weight:700}
.divi{font-size:13px;margin-right:5px;vertical-align:-1px}
.iconkey{font-size:11.5px;line-height:1.85;margin:8px 0;padding:9px 12px;background:var(--chip);border-radius:10px}
.iconkey .ikh{font-size:9.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.iconkey .rpill{font-size:9px;padding:1px 6px}
.ck{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:3px}
/* detail popup — info first, in priority order */
.dsec{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
.dsec:first-of-type{border-top:1px solid var(--line)}
.dlabel{font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-top:2px}
.dval{line-height:1.4}
.dsub{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.6}
/* Phone and email on the Client card are real and clickable — the browser
   default link blue is close to unreadable on the dark panel. */
.dsub a{color:var(--accent);font-weight:700;text-decoration:none}
.dsub a:hover{text-decoration:underline}
.av2{display:inline-flex;width:22px;height:22px;border-radius:50%;color:#fff;font-size:9px;font-weight:800;align-items:center;justify-content:center;vertical-align:-7px;margin-right:4px}
.rez{margin-bottom:7px}
.rez:last-child{margin-bottom:0}
.rez .ri{font-weight:700}
.rez .rf{font-size:11.5px;color:var(--accent);margin-top:2px}
.iclps{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.iclps summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--mut);list-style:none;outline:none}
.iclps summary::-webkit-details-marker{display:none}
.iclps summary::before{content:'▸ ';color:var(--mut)}
.iclps[open] summary::before{content:'▾ '}
/* Setup modal */
.setup{max-height:66vh;overflow-y:auto;margin:-2px -4px 0;padding:0 4px}
.setsec{margin-bottom:14px}
.setsec .seth{font-size:12.5px;font-weight:900;margin-bottom:6px;position:sticky;top:0;background:var(--panel);padding:2px 0}
.setrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:none}
.setrow b{min-width:60px}
.setrow input[type=color]{width:28px;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
.setrow select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 6px;font-size:11.5px}
.setrow input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
.setpill{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--chip);color:var(--mut);padding:1px 7px;border-radius:20px}
.keysec{margin-bottom:12px;font-size:12.5px;line-height:1.55;border-bottom:1px solid var(--line);padding-bottom:10px}
.keysec:last-child{border-bottom:none}
.keysec b{font-size:12.5px}
.keydemo{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:6px;padding:3px 8px;margin:3px 6px 3px 0;font-size:11.5px;font-weight:700}
.keychip{display:inline-block;border-left:5px solid var(--mut);padding:3px 8px;border-radius:4px;background:var(--chip);margin:3px 8px 3px 0;font-size:11.5px;font-weight:700}
.scenariobar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700}
.scenariobar b{font-weight:900}
.scenariobar .sp{margin-left:auto;display:flex;gap:8px}
.scenariobar .btn{background:rgba(255,255,255,.16);border:none;color:#fff}
.scenariobar .btn.pub{background:#fff;color:var(--accent);font-weight:800}
.demandcard .dmeta{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
.dtag{font-size:9px;font-weight:700;background:var(--chip);color:var(--mut);padding:1px 6px;border-radius:4px}
.optcard{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.optcard:hover{border-color:var(--accent)}
.optcard.best{border-color:var(--ok);background:rgba(27,122,80,.05)}
.optcard b{font-size:12.5px}
.optcard .rz{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.gtrow .glabel b{font-size:12.5px;display:block}
.gtrow .glabel small{font-size:10px;color:var(--mut)}
.gtrack{position:relative;flex:1;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(var(--gcol) - 1px),var(--grid) calc(var(--gcol) - 1px),var(--grid) var(--gcol))}
.gbar{position:absolute;top:9px;height:20px;border-radius:6px;color:#fff;font-size:9.5px;font-weight:800;padding:3px 7px;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.gbar.stack2{top:31px}
.gms{position:absolute;top:8px;width:13px;height:13px;background:var(--amb);transform:rotate(45deg);border:2px solid var(--panel);z-index:3}
.gtnow{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:2}

.viewhint{font-size:11px;color:var(--mut);padding:7px 14px;background:var(--chip);border-bottom:1px solid var(--line)}
/* Map / live-ops view */
.mapwrap{position:relative;margin:8px 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--rail)}
.mapctl{position:absolute;top:10px;left:10px;z-index:5;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:11px;font-weight:700;box-shadow:var(--shadow)}
.mapctl button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:4px 9px;font-weight:800;font-size:11px;cursor:pointer}
.mapctl button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mapctl button:disabled{cursor:default;opacity:.55}
.mapctl button.spinning{animation:gpsRefreshSpin .8s linear infinite}
@keyframes gpsRefreshSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mapctl button.spinning{animation:none;opacity:.55}}
.maplegend{position:absolute;bottom:10px;left:10px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:10.5px;box-shadow:var(--shadow);display:flex;gap:12px;flex-wrap:wrap}
.maplegend b{font-weight:800}
.truck{transition:transform 1s linear}
.truck .tbody{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.truck .tlabel{font-size:11px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}
.truck.moving .ring{animation:tpulse 1.4s infinite}
@keyframes tpulse{0%{r:14;opacity:.5}100%{r:26;opacity:0}}
.jobpin{cursor:pointer}
.townlbl{font-size:11px;font-weight:800;fill:var(--mut);opacity:.8}

/* subs delineation: your crews above, other companies below */
.subsplit{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;margin-top:6px;border-top:2px solid var(--line)}
.subsplit:before{content:"";flex:0 0 3px;height:14px;border-radius:2px;background:#7a6ea8}
.subsplit span{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.subsplit:after{content:"";flex:1;height:1px;background:var(--line)}
.row.extrow .rail .av{box-shadow:0 0 0 2px rgba(122,110,168,.45)}
.row.extrow .job{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 6px,transparent 6px 12px)}
/* lens filter bar */
.lensbar{display:flex;gap:7px;align-items:center;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
.lensbar .ll{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-right:2px}
.lchip-t{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700}
.lchip-t:hover{border-color:var(--accent)}
.lchip-t.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lchip-t .n{font-size:9px;font-weight:800;background:rgba(0,0,0,.14);padding:0 5px;border-radius:20px}
.lchip-t.on .n{background:rgba(255,255,255,.25)}

/* weather banner */
@media (max-width:820px){.advbanner{display:none!important}}
.advbanner{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;font-size:12px;background:rgba(93,101,123,.10);border-bottom:1px solid var(--line);flex-wrap:wrap}
.advbanner .af{display:flex;flex-direction:column;gap:1px;padding:5px 9px;border-radius:7px;background:var(--panel);border:1px solid var(--line);max-width:280px}
.advbanner .af b{font-size:11.5px;font-weight:800}
.advbanner .af span{font-size:10.5px;color:var(--mut);line-height:1.35}
.advbanner .af.high{border-left:3px solid var(--red)}
.advbanner .af.medium{border-left:3px solid var(--amb)}
.advbanner .af.low{border-left:3px solid var(--mut)}
.wxbanner{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;font-weight:600;background:rgba(183,121,31,.12);color:var(--amb);border-bottom:1px solid var(--line)}
.wxbanner b{font-weight:800}

/* on-board lens badges */
.job .lens-line{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.lbadge{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;background:var(--chip);color:var(--ink);white-space:nowrap}
.rail .asset{font-size:8.5px;font-weight:800;color:var(--mut);background:var(--chip);padding:1px 5px;border-radius:4px;margin-left:4px}
.wkcell.rainday{background:rgba(183,121,31,.08)}

/* layers drawer sections */
.laysec{margin-bottom:6px}
.laysec .lh{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:6px 2px;display:flex;align-items:center;gap:6px}
.layrow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:11.5px}
.layrow b{font-size:12px}
.layrow .r{float:right;font-weight:800}
.layrow .sub{color:var(--mut);font-size:10.5px;margin-top:2px}
.pillx{font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:20px;text-transform:uppercase}
.pillx.ok{background:rgba(27,122,80,.14);color:var(--ok)}
.pillx.wait{background:rgba(183,121,31,.16);color:var(--amb)}
.pillx.bad{background:rgba(198,91,78,.14);color:var(--warn)}

/* Field "My Day" — execution screen, not a shrunk dispatch board */
body.fieldmode .advbanner,body.fieldmode .sumstrip,body.fieldmode .lensbar,body.fieldmode .scenariobar,body.fieldmode .viewtabs,body.fieldmode #daynav,body.fieldmode #filtersWrap,body.fieldmode .unpanel,body.fieldmode #layerspanel,body.fieldmode .wxbanner,body.fieldmode .viewhint,body.fieldmode .mobile-note,body.fieldmode #modeDial,body.fieldmode header .btn:not(#themeBtn){display:none!important}
.myday{max-width:440px;margin:12px auto;padding:0 14px}
.md-hd{font-weight:900;font-size:20px;margin:4px 2px 0}
.md-sub{font-size:12.5px;color:var(--mut);margin:2px 2px 8px}
.md-label{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--mut);margin:16px 2px 7px}
.md-next{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel);box-shadow:var(--shadow)}
.md-next .t{font-size:23px;font-weight:900;line-height:1}
.md-next .c{font-size:17px;font-weight:800;margin-top:5px}
.md-next .a{font-size:13px;color:var(--mut);margin-top:1px}
.md-next .ty{font-size:13px;margin-top:9px}
.md-act{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.md-btn{padding:15px;border-radius:13px;border:none;font-size:15px;font-weight:800;background:var(--accent);color:#fff;cursor:pointer}
.md-btn.sec{background:var(--chip);color:var(--ink);font-weight:700;font-size:13px;padding:12px}
.md-row2{display:flex;gap:9px}
.md-row2 .md-btn{flex:1}
.md-stop{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:9px;background:var(--panel)}
.md-stop .tm{font-weight:800;font-size:13px;min-width:50px}
.md-stop.done{opacity:.5}
.md-stop .st{margin-left:auto;font-size:9.5px;font-weight:800}
.md-stop .st.at_risk{color:var(--amb)} .md-stop .st.blocked{color:var(--warn)}

.hidden{display:none!important}
.mobile-note{display:none;font-size:11px;color:var(--mut);padding:6px 14px;background:var(--chip);border-bottom:1px solid var(--line)}
@media (max-width:760px){
  :root{--hr-w:64px;--rail-w:132px;--row-h:84px}
  .unpanel{position:fixed;right:0;top:0;bottom:0;z-index:55;width:88vw;max-height:none;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
  .mobile-note{display:block}
  .sumstrip{gap:6px}
  .stat{padding:6px 9px}
  .brand{font-size:14px}
  .job{cursor:pointer}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><span class="hx">⬡</span> Dispatcher Command Center</div>
    <div class="viewtabs" id="viewtabs">
      <button class="vt on" data-v="day"   onclick="setView('day')">Day</button>
      <button class="vt"    data-v="week"  onclick="setView('week')">Week</button>
      <button class="vt"    data-v="month" onclick="setView('month')">Month</button>
      <button class="vt"    data-v="gantt" onclick="setView('gantt')">Jobs · Gantt</button>
      <button class="vt"    data-v="map"   onclick="setView('map')">🗺 Map</button>
    </div>
    <div class="daynav" id="daynav">
      <button class="btn icon" onclick="shiftDay(-1)">◀</button>
      <b id="dayLabel">—</b>
      <button class="btn icon" onclick="shiftDay(1)">▶</button>
      <button class="btn sm" id="todayBtn" onclick="goToday()">Today</button>
    </div>
    <div class="spacer"></div>
    <div class="dial"><label>Role</label>
      <select class="divf modesel" id="roleSel" onchange="setRole(this.value)">
        <option value="dispatcher">🧭 Dispatcher</option>
        <option value="owner">👑 Owner</option>
        <option value="pm">🏗️ Project Manager</option>
        <option value="sales">💬 Sales</option>
        <option value="field">👷 Field · My Day</option>
        <option value="office">📞 Office</option>
      </select></div>
    <button class="btn sm" id="filtersBtn" onclick="toggleFilters()" title="Advanced filters">⛃ Filters</button>
    <div class="dials hidden" id="filtersWrap">
      <div class="dial"><label>Scope</label>
        <select class="divf" id="scopeFilter" onchange="setScope(this.value)">
          <option value="company">Company</option>
          <option value="mine">My schedule</option>
        </select></div>
      <div class="dial"><label>Division</label>
        <select class="divf" id="divisionFilter" onchange="setDivision(this.value)"></select></div>
      <div class="dial"><label>Resource</label>
        <select class="divf" id="divFilter" onchange="setFilter(this.value)">
          <option value="all">All</option>
          <option value="crews">Crews</option>
          <option value="office">Office</option>
          <option value="subs">Subs</option>
          <option value="equipment">Equipment</option>
        </select></div>
    </div>
    <button class="btn sm" onclick="togglePeople()">👤 People</button>
    <button class="btn sm" id="reqBtn" onclick="openRequests()" style="display:none">📨 Requests</button>
    <button class="btn sm" id="nowBtn" onclick="jumpToNow()">◉ Now</button>
    <button class="btn sm" id="mapBgBtn" onclick="toggleMapBg()" title="Live service-area map behind the Day and Week calendars — jobs for the period plus real vehicle GPS. On by default; click to hide.">🗺 Map layer</button>
    <div class="dial" id="modeDial"><label>Control mode</label>
      <select class="divf modesel" id="modeSel" onchange="setMode(this.value)">
        <option value="mirror">🪞 Mirror only (Jobber runs it)</option>
        <option value="planning">✎ HiveLogic planning</option>
        <option value="live">⚡ HiveLogic live</option>
      </select></div>
    <button class="btn sm" id="freezeBtn" onclick="toggleFreeze()">✓ Freeze 60m: ON</button>
    <button class="btn sm" onclick="openSubPortal()" title="Preview what a subcontractor sees">🤝 Sub portal</button>
    <button class="btn sm" onclick="openSetup()" title="Calendar setup & settings">⚙ Setup</button>
    <button class="btn sm" onclick="openApptSettings()" title="Client messaging — confirmations, reminders, approvals (off until you go live)">✉ Messaging</button>
    <button class="btn sm" id="wxWidget" onclick="openWeather()" title="Weather — click for the full forecast">⛅ 83°</button>
    <button class="btn sm" onclick="openKey()" title="What do the symbols mean?">❓ Key</button>
    <button class="btn sm" id="themeBtn" onclick="toggleTheme()" title="Switch light / dark">🌙 Dark</button>
    <button class="btn primary sm" onclick="openCreate()" style="font-weight:800">+ Schedule</button>
  </div>
  <div class="pplbar hidden" id="pplbar"></div>
</header>

<div class="mobile-note">📱 Mobile: tap a job to move / reassign / pin. Drag works on desktop. Swipe the board sideways to see the full day.</div>
<div class="reinabar hidden" id="reinabar"></div>
<div class="scenariobar hidden" id="scenariobar"></div>
<div class="sumstrip" id="sumstrip"></div>
<div class="lensbar" id="lensbar"></div>
<div class="wxbanner hidden" id="wxbanner"></div>
<div class="advbanner hidden" id="advbanner"></div>
<div class="viewhint hidden" id="viewhint"></div>
<div id="rechainbanner"></div>

<div class="wrap">
  <div id="mapbg" aria-hidden="true"></div>
  <div id="mapbgctl"></div>
  <div id="mapbgtilt"><span>TILT</span><input type="range" min="0" max="75" step="1" value="0" aria-label="Background map tilt"><b>0&deg;</b></div>
  <div class="boardscroll" id="boardscroll">
    <div class="board" id="board"></div>
  </div>
  <aside class="unpanel" id="unpanel">
    <div class="unhd"><span>📋 Unscheduled <span id="unCount" class="pri"></span></span><button class="btn sm" onclick="toggleUnassigned(false)">✕</button></div>
    <div class="unlist" id="unlist"></div>
  </aside>
  <aside class="unpanel" id="layerspanel">
    <div class="unhd"><span>▤ Layers</span><button class="btn sm" onclick="LabUI.closeLayers()">✕</button></div>
    <div class="unlist" id="layerslist"></div>
  </aside>
</div>

<div class="legend" id="legend"></div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<div class="lamodal hidden" id="lookaround">
  <div class="labox">
    <div class="lahd"><span id="laTitle">🏠 Look around</span><button class="btn sm" onclick="closeLookAround()">✕ Close</button></div>
    <div class="labody" id="laBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- data.js is the LIVE adapter: it builds window.LAB from the real feeds, then loads app.js itself. -->
<script src="./advisor.js"></script>
<script src="./data.js"></script>
</body>
</html>
