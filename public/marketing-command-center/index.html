<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hive Marketing — Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body.cc-embedded .cc-logo, body.cc-embedded .cc-controlled, body.cc-embedded .cc-legacy-link { display:none !important; }
  :root{
    --navy:#161e2e; --navy2:#25304a; --gold:#748a9e; --gold-deep:#59718a;
    --cream:#f0f1f6; --card:#ffffff; --ink:#484f64; --muted:#5d657b;
    --green:#1B7A50; --amber:#7e86a0; --border:#dadde8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--ink);}
  .cc-shell{display:block;min-height:100vh;}
  .cc-topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;background:var(--card);border-bottom:1px solid var(--border);padding:12px 28px;}
  .cc-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .cc-logo .hex{width:32px;height:32px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .cc-logo-text{line-height:1.15;}
  .cc-logo-text b{display:block;font-size:14px;color:var(--ink);}
  .cc-logo-text span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;}
  .cc-controlled{font-size:10.5px;color:var(--muted);flex-shrink:0;}
  .cc-controlled b{color:var(--ink);}
  .cc-nav{display:flex;align-items:center;gap:3px;flex-wrap:wrap;background:var(--cream);padding:4px;border-radius:11px;border:1px solid var(--border);flex:1;}
  .cc-nav a{display:flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .cc-nav a svg{width:14px;height:14px;flex-shrink:0;}
  .cc-nav a.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,25,40,.08);}
  .cc-nav a:hover{color:var(--ink);}
  .cc-legacy-link{flex-shrink:0;}
  .cc-legacy-link a{color:var(--muted);font-size:11.5px;text-decoration:none;}
  .cc-legacy-link a:hover{color:var(--ink);}
  .cc-main{padding:32px 40px;max-width:1320px;margin:0 auto;}
  .cc-page-section{margin-bottom:40px;padding-bottom:40px;border-bottom:1px solid var(--border);}
  .cc-page-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  @media (max-width:760px){.cc-topbar{flex-wrap:wrap;} .cc-main{padding:20px 16px;}}
  .cc-h1{font-size:30px;font-weight:800;margin:0 0 6px;color:var(--navy);}
  .cc-sub{font-size:15px;color:var(--muted);margin:0 0 28px;}
  .cc-cards-row{display:flex;gap:18px;margin-bottom:24px;}
  .cc-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(20,20,20,.04);}
  .cc-stat-card{flex:1;display:flex;align-items:center;gap:16px;}
  .cc-icon-circle{width:52px;height:52px;border-radius:50%;background:#fdeecb;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cc-icon-circle svg{width:24px;height:24px;color:var(--gold-deep);}
  .cc-stat-val{font-size:24px;font-weight:800;color:var(--navy);line-height:1.2;}
  .cc-stat-label{font-size:13px;color:var(--muted);}
  .cc-home-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px;}
  .cc-home-tile{display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-decoration:none;color:inherit;transition:box-shadow .15s, transform .15s;}
  .cc-home-tile:hover{box-shadow:0 6px 18px rgba(20,20,20,.09);transform:translateY(-1px);}
  .cc-home-tile-title{font-weight:800;font-size:16.5px;color:var(--navy);margin:12px 0 6px;}
  .cc-home-tile-sub{font-size:13px;color:var(--muted);line-height:1.4;}
  @media (max-width:760px){.cc-home-grid{grid-template-columns:1fr;}}
  .cc-nav-more-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.4);padding:16px 12px 6px;}
  .cc-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .cc-bar-label{width:170px;flex-shrink:0;font-size:13px;color:var(--ink);font-weight:600;}
  .cc-bar-track{flex:1;background:#f1ede2;border-radius:6px;height:14px;overflow:hidden;}
  .cc-bar-fill{background:var(--gold);height:100%;border-radius:6px;}
  .cc-bar-value{width:90px;text-align:right;flex-shrink:0;font-size:12.5px;color:var(--muted);}
  .cc-pill{display:inline-block;font-size:11px;font-weight:700;background:#efeee9;color:var(--muted);border-radius:999px;padding:2px 9px;margin-top:4px;}
  .cc-list{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:24px;}
  .cc-list-row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);}
  .cc-list-row:last-child{border-bottom:none;}
  .cc-list-icon{width:38px;height:38px;border-radius:10px;background:#fdeecb;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cc-list-icon svg{width:19px;height:19px;color:var(--gold-deep);}
  .cc-list-body{flex:1;min-width:0;}
  .cc-list-title{font-weight:700;font-size:14.5px;color:var(--navy);}
  .cc-list-desc{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .cc-chev{color:#c7c2b3;font-size:16px;}
  .cc-status{font-size:13px;font-weight:700;white-space:nowrap;text-align:right;}
  .cc-status.ready{color:var(--green);}
  .cc-status.pending{color:var(--amber);}
  .cc-status.off{color:#9a9488;}
  .cc-status svg{width:14px;height:14px;vertical-align:-2px;margin-right:3px;flex-shrink:0;}
  .cc-status-sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted);max-width:230px;white-space:normal;}
  .cc-btn-row{display:flex;gap:12px;}
  .cc-btn{border:none;border-radius:11px;padding:13px 22px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .cc-btn-primary{background:var(--gold);color:var(--navy);}
  .cc-btn-primary:hover{background:var(--gold-deep);}
  .cc-btn-secondary{background:#fff;color:var(--navy);border:1.5px solid #d8d3c5;}
  .cc-btn-secondary:hover{background:#f3f0e8;}
  .cc-btn-block{width:100%;}
  .cc-ready-row{display:flex;gap:18px;margin-bottom:22px;}
  .cc-ready-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;}
  .cc-ready-card .cc-icon-circle{margin:0 auto 14px;width:60px;height:60px;}
  .cc-ready-card .cc-icon-circle svg{width:27px;height:27px;}
  .cc-ready-title{font-weight:800;font-size:15.5px;color:var(--navy);margin-bottom:4px;min-height:38px;}
  .cc-ready-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .cc-callout{display:flex;gap:14px;background:#fdf6e3;border:1px solid #f0dfa8;border-radius:14px;padding:16px 18px;margin-bottom:24px;align-items:flex-start;}
  .cc-callout .hex{width:30px;height:30px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .cc-callout p{margin:0;font-size:13.5px;color:#4a4530;line-height:1.5;}
  .cc-footer-bar{display:flex;align-items:center;gap:12px;background:#eef1fb;border-radius:14px;padding:16px 20px;font-size:14px;color:#33406b;}
  .cc-footer-bar .check{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .cc-slider-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:24px;}
  .cc-slider-minmax{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700;}
  input[type=range]{width:100%;height:6px;border-radius:4px;background:#e7e2d6;-webkit-appearance:none;margin:4px 0 18px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 1px #d8d3c5;cursor:pointer;}
  .cc-slider-value{text-align:center;font-size:30px;font-weight:800;color:var(--navy);}
  .cc-slider-value span{font-size:15px;font-weight:600;color:var(--muted);}
  .cc-slider-est{text-align:center;font-size:14.5px;color:var(--muted);margin-top:6px;}
  .cc-slider-est b{color:var(--green);}
  .cc-empty{padding:26px;text-align:center;color:var(--muted);font-size:14px;}
  .cc-loading{padding:40px;text-align:center;color:var(--muted);}
  .cc-badge-count{color:var(--green);font-weight:800;}
  .cc-conn-header{display:flex;justify-content:space-between;align-items:baseline;}
  a.cc-plain{color:inherit;text-decoration:none;}
  .cc-results-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .cc-results-table th{text-align:left;font-size:12px;color:var(--muted);padding:12px 16px;background:#f6f3ea;border-bottom:1px solid var(--border);}
  .cc-results-table td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--border);color:var(--ink);}
  .cc-results-table tr:last-child td{border-bottom:none;}
  .cc-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef1fb;color:#33406b;}
  .cc-field-row{display:flex;gap:18px;margin-bottom:18px;}
  .cc-field{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
  .cc-field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}
  .cc-field input[type=number],.cc-field select{width:100%;border:1.5px solid #d8d3c5;border-radius:9px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:var(--ink);background:#fff;}
  .cc-field-hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .cc-approval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:1000px){.cc-approval-grid{grid-template-columns:1fr;}}
  .cc-approval-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,20,.04);}
  .cc-approval-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--cream);}
  .cc-approval-plat{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--navy);}
  .cc-approval-plat .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .cc-approval-body{padding:14px;}
  .cc-approval-caption{font-size:12.5px;color:var(--ink);line-height:1.5;margin-bottom:10px;}
  .cc-approval-meta{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .cc-status-chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:10px;}
  .cc-status-chip.draft{background:#eef1fb;color:#33406b;}
  .cc-status-chip.pending_review{background:#fdeecb;color:var(--gold-deep);}
  .cc-status-chip.scheduled{background:#e6f4ec;color:var(--green);}
  .cc-status-chip.posted{background:#e6f4ec;color:var(--green);}
  .cc-status-chip.rejected{background:#fbe7e5;color:#b23327;}
  .cc-status-chip.failed{background:#fbe7e5;color:#b23327;}
  .cc-approval-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .cc-approval-error{font-size:11.5px;color:#b23327;background:#fbe7e5;border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.4;}
</style>
</head>
<body>
<script>if (new URLSearchParams(location.search).get('embedded')) { document.body.classList.add('cc-embedded'); }</script>
<div class="cc-shell">
  <div class="cc-topbar">
    <div class="cc-logo">
      <div class="hex">🐝</div>
      <div class="cc-logo-text"><b>Hive</b><span>Marketing</span></div>
    </div>
    <nav class="cc-nav" id="cc-nav"></nav>
    <div class="cc-controlled">Controlled by <b>Reina</b></div>
      </div>
  <main class="cc-main" id="cc-main"><div class="cc-loading">Loading real data&hellip;</div></main>
</div>

<script src="/hl-shared-auth.js"></script>
<script>
(function(){
  // Same helper every other authed HiveLogic module uses to read the
  // Supabase session token straight out of localStorage (see hlTokenSync
  // in index.html) -- this page is served from the same origin so the
  // same session applies with no separate login.
  // Marketing Suite Phase 2 (2026-07-30): this used to be its own separate
  // copy of the same token-parsing logic that lives in public/index.html.
  // Both are now the one shared /hl-shared-auth.js module (loaded via a
  // <script> tag above) -- this is a thin delegating wrapper so every
  // existing call site below (hlTokenSync()) keeps working unchanged.
  function hlTokenSync(){ return window.HL_AUTH.hlTokenSync(); }
  function api(resource, opts){
    opts = opts || {};
    var h = opts.headers ? Object.assign({}, opts.headers) : {};
    var t = hlTokenSync();
    if (t) h.Authorization = 'Bearer ' + t;
    if (opts.body) h['Content-Type'] = 'application/json';
    return fetch('/api/marketing?resource=' + resource, Object.assign({}, opts, {headers:h}))
      .then(function(r){ return r.json(); });
  }
  function apiSocial(resource, opts){
    opts = opts || {};
    var h = opts.headers ? Object.assign({}, opts.headers) : {};
    var t = hlTokenSync();
    if (t) h.Authorization = 'Bearer ' + t;
    if (opts.body) h['Content-Type'] = 'application/json';
    return fetch('/api/social-posts?resource=' + resource, Object.assign({}, opts, {headers:h}))
      .then(function(r){ return r.json(); });
  }

  function apiGrowth(resource, opts){
    opts = opts || {};
    var h = opts.headers ? Object.assign({}, opts.headers) : {};
    var t = hlTokenSync();
    if (t) h.Authorization = 'Bearer ' + t;
    if (opts.body) h['Content-Type'] = 'application/json';
    return fetch('/api/growth?resource=' + resource, Object.assign({}, opts, {headers:h}))
      .then(function(r){ return r.json(); });
  }
  function apiAds(resource, opts){
    opts = opts || {};
    var h = opts.headers ? Object.assign({}, opts.headers) : {};
    var t = hlTokenSync();
    if (t) h.Authorization = 'Bearer ' + t;
    if (opts.body) h['Content-Type'] = 'application/json';
    return fetch('/api/ads?resource=' + resource, Object.assign({}, opts, {headers:h}))
      .then(function(r){ return r.json(); });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ return '$' + Math.round(Number(n)||0).toLocaleString('en-US'); }

  var ICONS = {
    home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    doc:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    chart:'<path d="M4 20V10M12 20V4M20 20v-7"/>',
    link:'<path d="M9 15l6-6"/><path d="M8 8l1-1a4 4 0 015.7 0 4 4 0 010 5.7l-1 1"/><path d="M16 16l-1 1a4 4 0 01-5.7 0 4 4 0 010-5.7l1-1"/>',
    dollar:'<path d="M12 2v20M17 6.5c0-1.9-2.2-3.5-5-3.5s-5 1.6-5 3.5S9.2 10 12 10s5 1.6 5 3.5-2.2 3.5-5 3.5-5-1.6-5-3.5"/>',
    users:'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M16 13c2.8.3 5 2.6 5 5.6"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-5-5"/>',
    play:'<circle cx="12" cy="12" r="9.5"/><path d="M10 8.5l6 3.5-6 3.5z"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/>',
    star:'<path d="M12 2.5l2.9 6 6.6.7-4.9 4.5 1.3 6.5L12 16.9 6.1 20.2l1.3-6.5-4.9-4.5 6.6-.7z"/>',
    rocket:'<path d="M12 2c3 1.5 5 4.7 5 9 0 3-1 6-2 8l-3-2-3 2c-1-2-2-5-2-8 0-4.3 2-7.5 5-9z"/><circle cx="12" cy="10" r="1.6"/><path d="M8 17l-2.5 3.5M16 17l2.5 3.5"/>',
    monitor:'<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 21h6M12 17v4"/>',
    chat:'<path d="M3 5h18v11H8l-5 4z"/>',
    check:'<path d="M4 12.5l5 5L20 6"/>',
    clock:'<circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/>',
    globe:'<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.6 4.3 6 4.3 9.5s-1.5 6.9-4.3 9.5c-2.8-2.6-4.3-6-4.3-9.5s1.5-6.9 4.3-9.5z"/>',
    ad:'<path d="M3 9l7-5v16l-7-5z"/><path d="M10 6h6a5 5 0 010 10h-6"/>',
    store:'<path d="M3 9l1.5-5h15L21 9"/><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 9a4 4 0 008 0 4 4 0 008 0"/>',
    phone:'<path d="M5 3h4l2 5-2.5 2a12 12 0 006 6l2-2.5 5 2v4a2 2 0 01-2.2 2A18 18 0 013 5.2 2 2 0 015 3z"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
    idea:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.45 1 1.15 1 1.95V16h5v-.15c0-.8.4-1.5 1-1.95A6 6 0 0012 3z"/>',
  };
  function icon(name){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name]||ICONS.doc) + '</svg>'; }

  var NAV = [
    {key:'home', label:'Home', icon:'home'},
    {key:'plan', label:'Plan', icon:'doc'},
    {key:'growth', label:'Growth', icon:'chart'},
    {key:'paid_ads', label:'Paid Ads', icon:'dollar'},
    {key:'ready_for_you', label:'Ready for You', icon:'rocket'},
    {key:'content_approval', label:'Content Approval', icon:'chat'},
    {key:'ideas', label:'Ideas', icon:'idea'},
    {key:'calendar', label:'Calendar', icon:'calendar'},
    {key:'results', label:'Results', icon:'chart'},
    {key:'changes', label:'Change Requests', icon:'chat'},
    {key:'connections', label:'Connections', icon:'link'},
  ];

  // Primary nav matches the approved Figure 1 mockup exactly: Home / Plan /
  // Calendar / Results / Connections. Everything already shipped that isn't
  // in the mockup (Ready for You, Content Approval, Ideas, Change Requests)
  // stays fully reachable via the same hash routes -- grouped under "More"
  // so the sidebar reads as 5 items at a glance instead of 9 equal tabs.
  var NAV_PRIMARY_KEYS = ['home', 'plan', 'calendar', 'results', 'connections'];
  function navItem(key){ return NAV.filter(function(n){ return n.key === key; })[0]; }
  var NAV_PRIMARY = NAV_PRIMARY_KEYS.map(navItem);
  var NAV_MORE = NAV.filter(function(n){ return NAV_PRIMARY_KEYS.indexOf(n.key) === -1; });

  var STATE = { data:null };

  function renderNav(active){
    function itemHtml(n){
      return '<a href="#' + n.key + '" class="' + (n.key===active?'active':'') + '">' + icon(n.icon) + '<span>' + n.label + '</span></a>';
    }
    // One continuous scrolling page shows every section at once, so nav is
    // a flat row of jump-to-section pill tabs (matches the approved v3
    // mockup) instead of a primary/secondary split -- nothing hidden.
    document.getElementById('cc-nav').innerHTML = NAV.map(itemHtml).join('');
  }

  // ---------- Connect Everything ----------
  function connIconFor(key){
    return {website_cms:'globe', google_ads:'ad', google_business_profile:'store', email:'mail', meta_ads:'chat', sms:'phone'}[key] || 'link';
  }
  function statusMarkup(item){
    if (item.state === 'not_connected') {
      return '<span class="cc-status off cc-connect-trigger" data-channel-key="' + esc(item.key) + '" style="cursor:pointer">+ Connect<span class="cc-status-sub">' + esc(item.note) + '</span></span>';
    }
    if (item.ready) {
      return '<span class="cc-status ready">' + icon('check') + ' Connected<span class="cc-status-sub">' + esc(item.note) + '</span></span>';
    }
    return '<span class="cc-status pending">' + icon('clock') + ' In progress<span class="cc-status-sub">' + esc(item.note) + '</span></span>';
  }

        card.appendChild(closeBtn2);

      var errEl = document.createElement('div');
      errEl.style.cssText = 'font-size:12.5px;color:#a33;margin-bottom:10px;min-height:1em;';
      card.appendChild(errEl);

      var inputs = {};
      (entry.fields || []).forEach(function(f){
        var label = document.createElement('label');
        label.style.cssText = 'display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;color:var(--ink);';
        label.textContent = f.label + (f.required ? ' *' : '');
        card.appendChild(label);

        var input;
        if (f.type === 'select' && Array.isArray(f.options)) {
          input = document.createElement('select');
          f.options.forEach(function(opt){
            var o = document.createElement('option');
            o.value = opt; o.textContent = opt;
            input.appendChild(o);
          });
        } else {
          input = document.createElement('input');
          input.type = f.secret ? 'password' : 'text';
        }
        input.style.cssText = 'width:100%;box-sizing:border-box;padding:9px 11px;margin-bottom:4px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;';
        // Task #104: resume-my-own-setup prefill. Only a real value the owner
        // already saved for this exact platform pre-fills here -- never a
        // guess. Secret-typed fields (apiKey) are never pre-filled with the
        // real secret; savedSecretFields only tells us one already exists.
        var savedValue = (entry.savedValues && Object.prototype.hasOwnProperty.call(entry.savedValues, f.name)) ? entry.savedValues[f.name] : null;
        var hasSavedSecret = !!(f.secret && Array.isArray(entry.savedSecretFields) && entry.savedSecretFields.indexOf(f.name) !== -1);
        if (!f.secret && savedValue) { input.value = savedValue; }
        card.appendChild(input);
        inputs[f.name] = input;

        if (hasSavedSecret) {
          var secretHint = document.createElement('div');
          secretHint.style.cssText = 'font-size:11.5px;color:var(--muted);margin-bottom:4px;';
          secretHint.textContent = 'Already saved -- leave blank to keep it, or enter a new value to replace it.';
          card.appendChild(secretHint);
        }

        if (f.helpText) {
          var hint = document.createElement('div');
          hint.style.cssText = 'font-size:11.5px;color:var(--muted);margin-bottom:14px;';
          hint.textContent = f.helpText;
          card.appendChild(hint);
        }
      });

      var btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:10px;margin-top:10px;';
      card.appendChild(btnRow);

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'cc-btn cc-btn-secondary';
      cancelBtn.style.flex = '1';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', close);
      btnRow.appendChild(cancelBtn);

      var saveBtn = document.createElement('button');
      saveBtn.className = 'cc-btn cc-btn-primary';
      saveBtn.style.flex = '1';
      saveBtn.textContent = 'Save & Connect';
      saveBtn.addEventListener('click', function(){
        errEl.textContent = '';
        var fieldValues = {};
        var missing = [];
        (entry.fields || []).forEach(function(f){
          var val = inputs[f.name].value.trim();
          var keepsSavedSecret = !!(f.secret && !val && Array.isArray(entry.savedSecretFields) && entry.savedSecretFields.indexOf(f.name) !== -1);
          if (f.required && !val && !keepsSavedSecret) missing.push(f.label);
          fieldValues[f.name] = val;
        });
        if (missing.length) { errEl.textContent = missing.join(', ') + (missing.length === 1 ? ' is' : ' are') + ' required.'; return; }
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
        api('setup_account_fields', { method: 'POST', body: JSON.stringify({ platform: channelKey, fields: fieldValues }) })
          .then(function(r2){
            if (!r2 || !r2.ok) {
              errEl.textContent = (r2 && r2.error) || 'Could not save that connection. Try again.';
              saveBtn.disabled = false;
              saveBtn.textContent = 'Save & Connect';
              return;
            }
            close();
            loadAndRender();
          }).catch(function(e){
            errEl.textContent = 'Could not reach the server: ' + e.message;
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save & Connect';
          });
      });
      btnRow.appendChild(saveBtn);

      document.body.appendChild(overlay);
    }).catch(function(e){
      window.alert('Could not reach the server: ' + e.message);
    });
  }

function ccReject(approvalId){
    if (!window.confirm("Reject this and remove it from your queue? This will not delete the underlying draft.")) return;
    var reason = (window.prompt("Optional: add a reason (or leave blank).") || "").trim();
    api("approval_reject", { method: "POST", body: JSON.stringify({ approvalId: approvalId, reason: reason || undefined }) }).then(function(d){
      if (!d || !d.ok) { window.alert((d && d.error) || "Could not reject."); return; }
      loadAndRender();
    }).catch(function(e){ window.alert("Could not reject: " + e.message); });
  }

  function ccApprove(campaignId){

    if (!item) { window.alert('Could not find that campaign. Try refreshing.'); return; }
    var isReviewRequest = item.type === 'review_request';
    var sampleOppKey = OPP_KEY_BY_CAMPAIGN_TYPE[item.type];
    var remaining = (item.recipientCount || 0) - (item.sentCount || 0);

    var configPromise = isReviewRequest ? api('config').catch(function(){ return null; }) : Promise.resolve(null);
    var samplePromise = sampleOppKey
      ? api('opportunity_candidates&key=' + encodeURIComponent(sampleOppKey)).then(function(d){
          var c = (d && d.ok && d.candidates && d.candidates[0]) || null;
          if (!c) return null;
          return {
            clientName: c.clientName,
            jobTitle: c.jobTitle || c.lastJobTitle || null,
            quoteTitle: c.quoteTitle || null,
            quoteTotal: c.quoteTotal != null ? money(c.quoteTotal) : null
          };
        }).catch(function(){ return null; })
      : Promise.resolve(null);

    Promise.all([configPromise, samplePromise]).then(function(results){
      var config = results[0];

      var defaults = defaultTemplateForCampaign(item.type, reviewLink);

      card.appendChild(subjInput);

      var bodyLabel = document.createElement('label');
      bodyLabel.style.cssText = 'display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;color:var(--ink);';
      bodyLabel.textContent = 'Body (merge fields: {{clientName}}, {{jobTitle}})';
      card.appendChild(bodyLabel);
      var bodyInput = document.createElement('textarea');
      bodyInput.value = defaults.body;
      bodyInput.rows = 8;
      bodyInput.style.cssText = 'width:100%;box-sizing:border-box;padding:9px 11px;margin-bottom:14px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;font-family:inherit;resize:vertical;';
      card.appendChild(bodyInput);

      var regenRow = document.createElement('div');
      regenRow.style.cssText = 'margin-bottom:14px;';

      regenBtn.className = 'cc-btn cc-btn-secondary';
      regenBtn.style.cssText = 'margin:0;padding:8px 13px;font-size:12.5px;';
      regenBtn.textContent = 'Regenerate copy with AI';
      regenBtn.addEventListener('click', function(){
        regenBtn.disabled = true;
        var origRegenText = regenBtn.textContent;
        regenBtn.textContent = 'Regenerating...';
        api('campaign_regenerate_copy', { method: 'POST', body: JSON.stringify({ campaignId: campaignId }) }).then(function(d){
          regenBtn.disabled = false;

  // ---------- Adjust Your Budget: channel allocation preview ----------
  var OWNED_CHANNEL_KEYS = ['email', 'sms', 'google_business_profile', 'website_cms'];

  // Owned channels (email, sms, google business profile, website/seo) are
  // protected first since their cost is near zero. Paid channels split the
  // rest by their current share, dropping any that would fall below its
  // own min viable spend. No capacity cap or confidence score here -- no
  // real data source for either exists yet.
  function ccChannelAllocationPreview(newTotalCents, channels, connectionItems){
    if (!Number.isFinite(newTotalCents) || !Array.isArray(channels)) return null;
    var connByKey = {};
    (connectionItems || []).forEach(function(c){ connByKey[c.key] = c; });
    var rows = channels.map(function(c){
      var conn = connByKey[c.key];
      var isOwned = OWNED_CHANNEL_KEYS.indexOf(c.key) !== -1;
      var connected = !conn || conn.ready;
      var eligible = !c.paused && connected;
      return {
        key: c.key, label: c.label, isOwned: isOwned, eligible: eligible,
        currentCents: c.monthlyCents || 0, minViableSpendCents: c.minViableSpendCents,
        excludedReason: c.paused ? 'paused' : (!connected ? 'not connected' : null),
      };
    });
    var ownedEligible = rows.filter(function(r){ return r.eligible && r.isOwned; });
    var paidEligible = rows.filter(function(r){ return r.eligible && !r.isOwned; });
    var ineligible = rows.filter(function(r){ return !r.eligible; });
    var ownedTotal = ownedEligible.reduce(function(s,r){ return s + r.currentCents; }, 0);
    var remaining = newTotalCents - ownedTotal;
    var result = [];
    var note;
    if (remaining < 0) {
      var scale = ownedTotal > 0 ? (newTotalCents / ownedTotal) : 0;
      ownedEligible.forEach(function(r){
        result.push({ key: r.key, label: r.label, previewCents: Math.max(0, Math.round(r.currentCents * scale)), changed: true, excludedReason: null });
      });
      paidEligible.forEach(function(r){
        result.push({ key: r.key, label: r.label, previewCents: 0, changed: r.currentCents !== 0, excludedReason: null });
      });
      note = 'This budget is below what your owned channels (Email, Text, Google Business Profile, Website/SEO) need, so paid channels would pause and owned channels would scale down together.';
    } else {
      ownedEligible.forEach(function(r){
        result.push({ key: r.key, label: r.label, previewCents: r.currentCents, changed: false, excludedReason: null });
      });
      if (!paidEligible.length) {
        note = remaining > 0
          ? 'No paid channels are connected and active right now, so this increase has nowhere to go until you connect or unpause one.'
          : 'Owned channels stay protected first; no paid channels are connected and active right now.';
      } else {
        var paidBaseTotal = paidEligible.reduce(function(s,r){ return s + r.currentCents; }, 0);
        var active = paidEligible.map(function(r){
          return { key: r.key, label: r.label, minViableSpendCents: r.minViableSpendCents, currentCents: r.currentCents,
            share: paidBaseTotal > 0 ? (r.currentCents / paidBaseTotal) : (1 / (paidEligible.length || 1)) };
        });
        var dropped = [];
        var pool = remaining;
        var changedAny = true;
        while (changedAny && active.length) {
          changedAny = false;
          var shareTotal = active.reduce(function(s,r){ return s + r.share; }, 0);
          for (var i = 0; i < active.length; i++) {
            var r = active[i];
            var proposed = shareTotal > 0 ? Math.round(pool * (r.share / shareTotal)) : 0;
            if (r.minViableSpendCents != null && proposed > 0 && proposed < r.minViableSpendCents) {
              dropped.push(r);
              active.splice(i, 1);
              changedAny = true;
              break;
            }
          }
        }
        var shareTotalFinal = active.reduce(function(s,r){ return s + r.share; }, 0);
        active.forEach(function(r){
          var proposed = shareTotalFinal > 0 ? Math.round(pool * (r.share / shareTotalFinal)) : 0;
          result.push({ key: r.key, label: r.label, previewCents: proposed, changed: proposed !== r.currentCents, excludedReason: null });
        });
        dropped.forEach(function(r){
          result.push({ key: r.key, label: r.label, previewCents: 0, changed: true, excludedReason: 'below minimum viable spend' });
        });
        note = dropped.length
          ? ('At this budget, ' + dropped.map(function(r){ return r.label; }).join(', ') + (dropped.length === 1 ? ' would drop below its minimum viable spend and pause' : ' would drop below their minimum viable spend and pause') + ', so the rest of your paid channels would pick up the difference.')
          : 'Owned channels stay protected first; the rest is split across your paid channels in their current proportions.';
      }
    }
    ineligible.forEach(function(r){
      if (result.some(function(x){ return x.key === r.key; })) return;
      result.push({ key: r.key, label: r.label, previewCents: 0, changed: r.currentCents !== 0, excludedReason: r.excludedReason });
    });
    return { rows: result, note: note };
  }

  // ---------- Adjust Your Budget ----------
    // Mirrors api/marketing.js's computeForecast() 'ready'-path math exactly
  // (same CC_FORECAST_BANDS multipliers, same formula) so the budget slider
  // can show a live lead-range preview as it moves, with no round-trip API
  // call per tick and nothing saved until Save Budget is clicked. Reads only
  // the exact real assumptions the server already returned in
  // data.plan.forecast.inputs -- never invents its own numbers, and returns
  // null (never a fabricated estimate) when any required real input is missing.
  var CC_FORECAST_BANDS = { conservative: 0.65, expected: 1.0, upside: 1.35 };
  function ccLiveForecastText(inputs, budgetDollars){
    if (!inputs || inputs.grossMarginPct == null || inputs.qualifiedLeadRatePer100 == null || inputs.closeRatePct == null || !inputs.avgJobValueCents) return null;
    var band = (inputs.riskPosture === 'conservative') ? 'conservative' : (inputs.riskPosture === 'aggressive' ? 'upside' : 'expected');
    var mult = CC_FORECAST_BANDS[band];
    var qualifiedLeads = (budgetDollars/100) * inputs.qualifiedLeadRatePer100 * mult;
    var soldJobs = qualifiedLeads * (inputs.closeRatePct/100);
    if (inputs.maxNewJobsPerMonth != null) soldJobs = Math.min(soldJobs, inputs.maxNewJobsPerMonth);
    var leadsR = Math.round(qualifiedLeads*10)/10;
    var jobsR = Math.round(soldJobs*10)/10;
    var bandLabelText = band === 'conservative' ? 'Conservative' : (band === 'upside' ? 'Upside' : 'Expected');
    return money(budgetDollars) + '/month \u2192 ~' + leadsR + ' qualified leads, ~' + jobsR + ' sold jobs (' + bandLabelText + ')';
  }

function renderBudget(data){

      });
      document.getElementById('cc-budget-save').addEventListener('click', function(){

              dailyMaxDollars: num('cc-ch-' + c.key + '-daily'),
              testingAllowanceDollars: num('cc-ch-' + c.key + '-testing') || 0,
              approvalThresholdDollars: num('cc-ch-' + c.key + '-approval'),
              paused: document.getElementById('cc-ch-' + c.key + '-paused').checked,

          });
          api('command_center_budget_channels', {method:'POST', body: JSON.stringify({monthlyDollars: Number(slider.value), channels: payload})}).then(function(){
            loadAndRender();

            window.alert('Could not save channel settings: ' + e.message);
          });

      var recBtn = document.getElementById('cc-budget-recommend');
      if (recBtn) {
        recBtn.addEventListener('click', function(){
          var btn = this; btn.disabled = true; btn.textContent = 'Loading...';
          api('setup_budget_recommendation&monthlyDollars=' + Number(slider.value)).then(function(r){
            btn.disabled = false; btn.textContent = 'See Recommended Split';
            if (!r || !r.ok) { window.alert((r && r.error) || 'Could not load a recommendation.'); return; }
            renderRecommendation(r);
          }).catch(function(e){
            btn.disabled = false; btn.textContent = 'See Recommended Split';
            window.alert('Could not load a recommendation: ' + e.message);
          });
        });
      }
      function renderRecommendation(rec){
        var box = document.getElementById('cc-budget-recommendation');
        if (!box) return;
        var rowsHtml = rec.channels.map(function(c){
          var dataTag = c.hasRealData === true ? '<span class="cc-tag">real data</span>'
            : (c.hasRealData === false ? '<span class="cc-tag">no data yet</span>' : '');
          return '<div class="cc-list-desc" style="margin-bottom:6px;">' + esc(c.label) + ': ' +

  // ---------- Planning Assumptions ----------

      var a = (r && r.assumptions) || {grossMarginPct:null, qualifiedLeadRatePer100:null, closeRatePct:null, maxNewJobsPerMonth:null, riskPosture:'balanced', avgJobValueCents:null};
      var ref = (r && r.reference) || {};
      var refAvg = ref.realAvgJobValueCents;
      var refJobs = ref.realHistoricalJobsPerMonth;
      var refEstCount = ref.realOpenEstimatesCount;
      var refEstValue = ref.realOpenEstimatesValue;
      var refEstStale = ref.realOpenEstimatesStaleCount;
      var rationale = (r && r.rationale) || [];
      setTimeout(function(){
        var btn = document.getElementById('cc-assump-save');
        if (!btn) return;
        btn.addEventListener('click', function(){
          btn.disabled = true; btn.textContent = 'Saving...';

            grossMarginPct: document.getElementById('cc-a-margin').value,
            qualifiedLeadRatePer100: document.getElementById('cc-a-leadrate').value,
            closeRatePct: document.getElementById('cc-a-close').value,
            maxNewJobsPerMonth: document.getElementById('cc-a-maxjobs').value,
            avgJobValueDollars: document.getElementById('cc-a-avgjob').value,
            riskPosture: document.getElementById('cc-a-risk').value
          };
          api('command_center_assumptions', {method:'POST', body: JSON.stringify(body)}).then(function(res){
            if (!res || !res.ok) { btn.disabled = false; btn.textContent = 'Save Assumptions'; alert((res && res.error) || 'Could not save.'); return; }
            location.hash = 'plan'; loadAndRender();
          });
        });
      }, 0);
      function field(id, label, value, opts){
        opts = opts || {};
        var attrs = '';
        if (opts.min != null) attrs += ' min="' + opts.min + '"';
        if (opts.max != null) attrs += ' max="' + opts.max + '"';
        if (opts.step != null) attrs += ' step="' + opts.step + '"';
        if (opts.placeholder) attrs += ' placeholder="' + esc(opts.placeholder) + '"';

          '<input type="number" id="' + id + '" value="' + (value == null ? '' : value) + '"' + attrs + '>' +

        '</div>' +
        (rationale.length ? (
          '<div class="cc-card" style="margin-bottom:24px;">' +
          '<div class="cc-list-title" style="margin-bottom:10px;">Why this plan</div>' +
          rationale.map(function(item){
            var tag = item.priority === 'blocker' ? 'Blocker' : (item.priority === 'opportunity' ? 'Opportunity' : 'Note');
            return '<div class="cc-list-desc" style="margin-bottom:8px;"><span class="cc-tag">' + esc(tag) + '</span> ' + esc(item.text) + '</div>';
          }).join('') +

        '<div class="cc-field-row">' +
          field('cc-a-margin', 'Gross margin %', a.grossMarginPct, {min:0, max:100, step:0.1, hint:'What share of revenue is profit after direct costs.'}) +
          field('cc-a-leadrate', 'Qualified leads per $100 spent', a.qualifiedLeadRatePer100, {min:0, step:0.1, hint:'Your best estimate -- no ad history exists yet to measure this.'}) +
        '</div>' +
        '<div class="cc-field-row">' +
          field('cc-a-close', 'Close rate %', a.closeRatePct, {min:0, max:100, step:0.1, hint:'Share of qualified leads that become paying jobs.'}) +
          field('cc-a-maxjobs', 'Max new jobs/month (optional)', a.maxNewJobsPerMonth, {min:0, step:1, hint:'Caps the forecast at what your crew can actually take on.'}) +
        '</div>' +
        '<div class="cc-field-row">' +
          field('cc-a-avgjob', 'Avg job value $ override (optional)', a.avgJobValueCents == null ? null : (a.avgJobValueCents/100), {min:0, step:1, placeholder: refAvg ? String(Math.round(refAvg/100)) : '', hint:'Leave blank to use the real average above.'}) +
          '<div class="cc-field"><label>Risk posture</label><select id="cc-a-risk">' + riskOptions + '</select><div class="cc-field-hint">Which band headlines your Plan screen.</div></div>' +

        '<button class="cc-btn cc-btn-secondary" onclick="location.hash=\'plan\'">Go Back</button></div>';

  // ---------- Calendar (Phase 10 -- real scheduled campaign sends) ----------
  function calendarIconFor(ev){
    return { email: 'mail', sms: 'phone' }[ev.channel] || 'calendar';
  }
  function calendarDateLabel(iso){
    if (!iso) return 'Unscheduled';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return 'Unscheduled';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function calendarRangeLabel(schedule){
    if (!schedule.windowStart || !schedule.windowEnd) return 'in the current rolling window';
    return 'from ' + calendarDateLabel(schedule.windowStart) + ' to ' + calendarDateLabel(schedule.windowEnd);
  }
  function renderCalendar(data){
    var schedule = (data && data.schedule) || { events: [], notYetTracked: [] };
    var events = schedule.events || [];
    var rows = events.length ? events.map(function(ev){
      return '<div class="cc-list-row"><div class="cc-list-icon">' + icon(calendarIconFor(ev)) + '</div>' +
        '<div class="cc-list-body"><div class="cc-list-title">' + esc(ev.name) + '</div>' +
        '<div class="cc-list-desc">' + esc(calendarDateLabel(ev.scheduledAt)) + ' &middot; ' + esc(ev.channel || '') + '</div></div>' +
        '<span class="cc-tag">' + esc(ev.status) + '</span></div>';
    }).join('') : '';
    var listOrEmpty = events.length
      ? '<div class="cc-list">' + rows + '</div>'
      : '<div class="cc-card cc-empty">No campaign sends are scheduled in this window. Approve something from <a class="cc-plain" style="color:var(--gold-deep);font-weight:700" href="#home">Ready for You</a> to put one on the calendar.</div>';
    var notYetHtml = (schedule.notYetTracked && schedule.notYetTracked.length)
      ? '<p class="cc-sub" style="margin-top:16px">Not yet tracked on this calendar: ' + esc(schedule.notYetTracked.join(', ').split('_').join(' ')) + '.</p>'
      : '';
    return '<h1 class="cc-h1">Calendar</h1>' +
      '<p class="cc-sub">Real scheduled campaign sends ' + esc(calendarRangeLabel(schedule)) + '.</p>' +
      listOrEmpty +
      notYetHtml;
  }

  // ---------- Results (real campaign performance + attribution) ----------
  // Phase 18 extension: this view previously only rendered the raw
  // `campaigns` resource (recipients/sent/response-rate/booked). It now
  // also fetches the real `attribution` resource (the same first-touch
  // engine already wired into the legacy dashboard's Results & Attribution
  // panel, see commit 0b2f5a5) and renders it as a second section below --
  // reusing this file's own existing cc-cards-row/cc-stat-card/cc-results-
  // table styling, no new CSS. The attribution fetch is wrapped in its own
  // .catch so a failure there degrades that section honestly without
  // breaking the pre-existing campaigns table above it.
  function renderResults(data){
    return Promise.all([
      api('campaigns'),
      api('attribution').catch(function(){ return null; }),
    ]).then(function(results){
      var r = results[0];
      var attr = results[1];
      var campaigns = (r && r.campaigns) || [];
      var rowsHtml = campaigns.length ? campaigns.map(function(c){
        return '<tr><td>' + esc(c.name) + '<div><span class="cc-tag">' + esc(c.status) + '</span></div></td>' +
          '<td>' + c.recipientCount + '</td><td>' + c.sent + '</td>' +
          '<td>' + (c.responseRate==null ? '—' : c.responseRate + '%') + '</td>' +
          '<td>' + c.booked + '</td><td>' + money(c.bookedValue) + '</td></tr>';
      }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No campaigns yet.</td></tr>';

      var attrOk = !!(attr && attr.ok);
      var lastTouch = attrOk ? (attr.lastTouch || null) : null;
      var lastTouchByCampaign = {};
      (lastTouch && lastTouch.campaigns || []).forEach(function(c){ lastTouchByCampaign[c.campaignId] = c; });
      var assisted = attrOk ? (attr.assisted || null) : null;
      var assistedByCampaign = {};
      (assisted && assisted.campaigns || []).forEach(function(c){ assistedByCampaign[c.campaignId] = c; });
      var coverage = attrOk ? attr.attributionCoveragePct : null;
      var attrCards = '<div class="cc-cards-row">' +
        '<div class="cc-card cc-stat-card"><div class="cc-icon-circle">' + icon('chart') + '</div>' +
          '<div><div class="cc-stat-val">' + (coverage != null ? coverage + '%' : 'Not yet') + '</div><div class="cc-stat-label">attribution coverage<span class="cc-pill">Real completed jobs matched to a real prior send</span></div></div></div>' +
        '<div class="cc-card cc-stat-card"><div class="cc-icon-circle">' + icon('dollar') + '</div>' +
          '<div><div class="cc-stat-val">' + money(attrOk ? (attr.totalAttributedRevenueCents || 0) / 100 : 0) + '</div><div class="cc-stat-label">attributed revenue (first-touch)</div></div></div>' +
        '<div class="cc-card cc-stat-card"><div class="cc-icon-circle">' + icon('users') + '</div>' +
          '<div><div class="cc-stat-val">' + (attrOk ? (attr.totalUnattributedJobs || 0) : '—') + '</div><div class="cc-stat-label">unattributed jobs</div></div></div>' +
        (lastTouch ? ('<div class="cc-card cc-stat-card"><div class="cc-icon-circle">' + icon('dollar') + '</div>' +
          '<div><div class="cc-stat-val">' + money((lastTouch.totalAttributedRevenueCents || 0) / 100) + '</div><div class="cc-stat-label">attributed revenue (last-touch)</div></div></div>') : '') +
        (assisted ? ('<div class="cc-card cc-stat-card"><div class="cc-icon-circle">' + icon('users') + '</div>' +
          '<div><div class="cc-stat-val">' + (assisted.totalAssistedConversions || 0) + '</div><div class="cc-stat-label">assisted conversions</div></div></div>') : '') +
        '</div>';

      var attrCampaigns = attrOk ? (attr.campaigns || []) : [];
      var attrRowsHtml = attrCampaigns.length ? attrCampaigns.map(function(c){
        var lt = lastTouchByCampaign[c.campaignId];
        return '<tr><td>' + esc(c.name) + '</td><td>' + c.recipientsSent + '</td><td>' + c.respondedCount + '</td>' +
          '<td>' + c.bookedCount + '</td><td>' + c.firstTouchJobCount + '</td>' +
          '<td>' + (c.firstTouchRevenueCents ? money(c.firstTouchRevenueCents / 100) : '—') + '</td>' +
          '<td>' + (lt ? lt.lastTouchJobCount : '—') + '</td>' +
          '<td>' + (lt && lt.lastTouchRevenueCents ? money(lt.lastTouchRevenueCents / 100) : '—') + '</td>' +
          '<td>' + (assistedByCampaign[c.campaignId] ? assistedByCampaign[c.campaignId].assistedConversions : '—') + '</td></tr>';
      }).join('') : ('<tr><td colspan="9" style="text-align:center;color:var(--muted)">' + (attrOk ? 'No campaigns yet -- attribution will populate once real campaigns send and jobs complete.' : 'Could not load attribution.') + '</td></tr>');

      var attrNote = attrOk
        ? ('First-touch model: a job is credited to the earliest real campaign send to that client on or before the day it completed. Last-touch model: the same real jobs credited to the latest real send instead. Assisted model: a campaign is credited whenever it touched the customer before the closing send. ' + esc(attr.notYetMeasurableReason || ''))
        : 'Could not load attribution data.';

      return '<h1 class="cc-h1">Results</h1>' +
        '<p class="cc-sub">Real performance from every campaign Reina has sent.</p>' +
        '<table class="cc-results-table" style="margin-bottom:24px;"><thead><tr><th>Campaign</th><th>Recipients</th><th>Sent</th><th>Response rate</th><th>Booked</th><th>Booked value</th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody></table>' +
        '<h1 class="cc-h1" style="font-size:22px;">Attribution</h1>' +
        '<p class="cc-sub">Which campaign gets credit for a completed job -- the same real first-touch model shown on the legacy Results panel, not a second, independent estimate.</p>' +
        attrCards +
        '<table class="cc-results-table"><thead><tr><th>Campaign</th><th>Recipients</th><th>Responded</th><th>Booked</th><th>First-touch jobs</th><th>First-touch revenue</th><th>Last-touch jobs</th><th>Last-touch revenue</th><th>Assisted conversions</th></tr></thead>' +
        '<tbody>' + attrRowsHtml + '</tbody></table>' +
        '<div class="cc-list-desc" style="margin-top:12px;">' + attrNote + '</div>';
    });
  }

  // ---------- Reina: Change Requests (M1a approvals) ----------
  function confTag(c){
    if (c == null) return '';
    var cls = c >= 80 ? 'ready' : (c >= 60 ? 'pending' : 'off');
    return '<span class="cc-status ' + cls + '" style="position:static;white-space:nowrap">' + c + '% confidence</span>';
  }
  function crBullets(label, arr){
    if (!arr || !arr.length) return '';
    return '<div style="margin-top:8px"><strong style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">' + label + '</strong>' +
      '<ul style="margin:4px 0 0;padding-left:18px">' + arr.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join('') + '</ul></div>';
  }
  function renderChangeRequests(){
    return api('reina_change_requests').then(function(r){
      if (!r || !r.ok) {
        return '<h1 class="cc-h1">Change Requests</h1><div class="cc-card cc-empty">' + esc((r && r.error) || 'Could not load change requests.') + '</div>';
      }
      var items = r.pending || [];
      STATE.changeRequests = items;
      var header = '<h1 class="cc-h1">Change Requests</h1>' +
        '<p class="cc-sub">Reina reads the client message and drafts a recommendation here. Approving records your decision -- it does not create the change order or email the client yet.</p>';
      if (!items.length) {
        return header + '<div class="cc-card cc-empty">Nothing waiting. Reina posts here whenever a client asks to change a job.</div>';
      }
      var cards = items.map(function(it){
        var amount = it.needsEstimatorPricing
          ? '<span class="cc-tag">Needs estimator pricing</span>'
          : '<strong>' + money((it.amountCents || 0) / 100) + '</strong> <span class="cc-sub" style="font-size:12px">(client-stated)</span>';
        var testBadge = it.isTest ? '<span class="cc-tag" style="background:#fde68a;color:#92400e;margin-right:6px">test</span>' : '';
        return '<div class="cc-card" style="margin-bottom:14px">' +
          '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">' +
            '<div class="cc-list-title">' + testBadge + esc(it.title) + '</div>' + confTag(it.confidence) +
          '</div>' +
          '<div class="cc-sub" style="margin:2px 0 10px">' + esc(it.target || '') + ' &middot; ' + amount + '</div>' +
          '<div style="white-space:pre-wrap;line-height:1.5">' + esc(it.rationale) + '</div>' +
          crBullets('Risks', it.risks) +
          crBullets('Open gaps', it.gaps) +
          '<div style="display:flex;gap:10px;margin-top:14px">' +
            '<button class="cc-btn cc-btn-primary" onclick="ccReinaDecide(\'' + esc(it.id) + '\',\'approved\')">Approve</button>' +
            '<button class="cc-btn" onclick="ccReinaDecide(\'' + esc(it.id) + '\',\'rejected\')">Reject</button>' +
          '</div></div>';
      }).join('');
      return header + '<div>' + cards + '</div>';
    });
  }
  function ccReinaDecide(id, decision){
    var reason = null;
    if (decision === 'rejected') {
      reason = window.prompt('Optional: why are you rejecting this? (leave blank to skip)') || null;
    }
    api('reina_change_request_decide', { method:'POST', body: JSON.stringify({ id:id, decision:decision, reason:reason }) })
      .then(function(r){
        if (!r || !r.ok) { window.alert((r && r.error) || 'Could not save your decision.'); return; }
        render(); // the decided row is no longer pending -- reload the list
      })
      .catch(function(){ window.alert('Could not reach the server. Try again.'); });
  }
  window.ccReinaDecide = ccReinaDecide;
  // ---------- Ideas (Phase 9: owner-submitted ideas -> future campaign briefs) ----------
  // Text-only submission for now -- matches api/marketing.js's handleIdeasPost,
  // which rejects any other inputMode because no voice/photo/video/document
  // upload or transcription pipeline exists yet. Do not add a file picker
  // here until that backend pipeline is real.
  function renderIdeas(data){
    return api('ideas').then(function(r){
      var notSynced = r && r.ok === false && /not set up yet/i.test(r.error || '');
      var ideas = (r && r.ok && r.ideas) || [];
      var rowsHtml = ideas.length ? ideas.map(function(idea){
        var when = idea.createdAt ? new Date(idea.createdAt).toLocaleDateString() : '';
        var attLine = idea.attachmentCount ? (' · ' + idea.attachmentCount + (idea.attachmentCount === 1 ? ' attachment' : ' attachments')) : '';
        var statusLine = esc(idea.status) + (when ? ' · ' + esc(when) : '') + attLine;
        var actionHtml = (idea.status === 'submitted' || idea.status === 'error')
          ? '<button class="cc-btn cc-btn-secondary" style="margin-top:6px;padding:7px 12px;font-size:12.5px" onclick="ccGenerateBrief(\'' + idea.id + '\')">' + (idea.status === 'error' ? 'Retry Brief' : 'Generate Brief') + '</button>'
          : (idea.status === 'brief_ready'
            ? (idea.campaignId
              ? '<div style="margin-top:6px;font-size:12.5px;color:var(--green);font-weight:600">Campaign created</div>'
              : '<button class="cc-btn cc-btn-primary" style="margin-top:6px;padding:7px 12px;font-size:12.5px" onclick="ccCreateCampaignFromIdea(\'' + idea.id + '\')">Create Campaign</button>')
            : '');
        // Attaching more evidence (a follow-up photo, a document) stays
        // useful even after a brief already exists -- not gated by status.
        var addFileHtml = '<label class="cc-btn cc-btn-secondary" style="margin-top:6px;margin-left:6px;padding:7px 12px;font-size:12.5px;display:inline-block;cursor:pointer">+ Add file<input type="file" style="display:none" onchange="ccAttachFileToIdea(\'' + idea.id + '\', this)"></label>';
        var errorHtml = (idea.status === 'error' && idea.errorReason)
          ? '<div style="color:#b3261e;font-size:12px;margin-top:4px">' + esc(idea.errorReason) + '</div>'
          : '';
        var briefHtml = '';

  // Phase 9 upload-wiring slice (2026-07-31): real file attachments for
  // Ideas, backed by resource=idea_attachments (api/marketing.js) and
  // marketing_attachments (sql/039). readFileAsDataUrl turns a browser
  // File into the base64 data: URL the backend's uploadDataUrl() expects
  // -- the same shape the sub-portal's own camera-capture uploads use.
  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error('Could not read that file.')); };
      reader.readAsDataURL(file);
    });
  }

  function attachmentKindForFile(file){
    var t = (file.type || '').toLowerCase();
    if (t.indexOf('image/') === 0) return 'photo';
    if (t.indexOf('video/') === 0) return 'video';
    if (t.indexOf('audio/') === 0) return 'audio';
    return 'document';
  }

  // Conservative client-side guard: this deployment's serverless functions
  // parse the whole request body as JSON, so a very large base64 payload
  // risks a confusing platform-level 413 rather than the honest error
  // below. 4MB is deliberately conservative, not a real measured ceiling.
  var CC_MAX_ATTACHMENT_BYTES = 4 * 1024 * 1024;

  function ccSubmitIdeaFile(inputEl){
    var errEl = document.getElementById('cc-idea-file-error');
    var nameEl = document.getElementById('cc-idea-file-name');
    var captionEl = document.getElementById('cc-idea-file-caption');
    if (errEl) errEl.textContent = '';
    var file = inputEl && inputEl.files && inputEl.files[0];
    if (!file) return;
    if (nameEl) nameEl.textContent = file.name;
    if (file.size > CC_MAX_ATTACHMENT_BYTES) {
      if (errEl) errEl.textContent = 'That file is too large for this environment right now (max 4MB). Try a smaller file.';
      inputEl.value = '';
      return;
    }
    var attachmentType = attachmentKindForFile(file);
    // handleIdeasPost's inputMode vocabulary (text/voice_note/photo/video/
    // document) doesn't match attachmentType's vocabulary (photo/video/
    // audio/document) for the audio case -- map it here rather than
    // reusing attachmentType directly as inputMode.
    var ideaInputMode = attachmentType === 'audio' ? 'voice_note' : attachmentType;
    var caption = captionEl ? captionEl.value.trim() : '';
    readFileAsDataUrl(file).then(function(dataUrl){
      return api('ideas', { method: 'POST', body: JSON.stringify({ inputMode: ideaInputMode, rawText: caption || undefined }) }).then(function(r){
        if (!r || !r.ok) throw new Error((r && r.error) || 'Could not create an idea for that file.');
        return api('idea_attachments', { method: 'POST', body: JSON.stringify({ ideaId: r.idea.id, attachmentType: attachmentType, fileDataUrl: dataUrl, fileName: file.name }) });
      });
    }).then(function(r){
      if (!r || !r.ok) { if (errEl) errEl.textContent = (r && r.error) || 'Could not attach that file.'; return; }
      render();
    }).catch(function(e){
      if (errEl) errEl.textContent = (e && e.message) || 'Could not attach that file.';
    });
  }

  function ccAttachFileToIdea(ideaId, inputEl){
    var file = inputEl && inputEl.files && inputEl.files[0];

    if (file.size > CC_MAX_ATTACHMENT_BYTES) {

  }

  // ---------- Channel comparison bar chart (real current monthly spend) ----------
  function ccChannelBarChart(channels){
    var items = (channels || []).filter(function(c){ return !c.paused && (c.monthlyCents || 0) > 0; })
      .map(function(c){ return {label: c.label, cents: c.monthlyCents || 0}; });
    if (!items.length) return '';
    items.sort(function(a,b){ return b.cents - a.cents; });
    var max = items.reduce(function(m,c){ return Math.max(m, c.cents); }, 0);
    var barsHtml = items.map(function(c){
      var pct = max > 0 ? Math.max(2, Math.round((c.cents / max) * 100)) : 0;
      return '<div class="cc-bar-row">' +
        '<div class="cc-bar-label">' + esc(c.label) + '</div>' +
        '<div class="cc-bar-track"><div class="cc-bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="cc-bar-value">' + money(c.cents / 100) + '/mo</div>' +
      '</div>';
    }).join('');
    return '<div class="cc-card" style="margin-bottom:24px;">' +
      '<div class="cc-list-title" style="margin-bottom:12px;">Channel Comparison (current monthly spend)</div>' +
      barsHtml +
    '</div>';

  function screenFor(route, data){
    if (route === 'plan') return renderPlan(data);
    if (route === 'budget') return renderBudget(data);
    if (route === 'connections') return renderConnections(data);
    if (route === 'growth') return renderGrowth();
    if (route === 'paid_ads') return renderPaidAds();
    if (route === 'ready_for_you') return renderReadyForYou(data);
    if (route === 'content_approval') return renderContentApproval();
    if (route === 'calendar') return renderCalendar(data);
    if (route === 'results') return renderResults(data);
    if (route === 'changes') return renderChangeRequests(data);
    if (route === 'ideas') return renderIdeas(data);
    if (route === 'assumptions') return renderAssumptions(data);
    // Home gets an explicit route so hitting #home always renders the
    // real Figure-1 dashboard (renderHome), instead of relying only on
    // the adaptive fallback below -- that fallback is intentionally left
    // untouched (still covers any unrecognized/empty route) per the
    // existing marketing-command-center-nav.test.mjs regression coverage.
    if (route === 'home') return renderHome(data);
    // home: adaptive
    if (data.connections.connected < data.connections.total) return renderConnections(data);
    if (data.readyForYou.items.length) return renderReadyForYou(data);
    return renderPlan(data);
  }

  function route(){ return (location.hash || '#home').slice(1); }

  function render(){
    if (!STATE.data) return;
    var r = route();
    var navActive = (r === 'budget' || r === 'assumptions') ? 'plan' : r;
    renderNav(navActive);
    var data = STATE.data;
    var sections = [
      {key:'home', out: renderHome(data)},
      {key:'content_approval', out: renderContentApproval()},
      {key:'plan', out: renderPlan(data)},
      {key:'growth', out: renderGrowth()},
      {key:'paid_ads', out: renderPaidAds()},
      {key:'ready_for_you', out: renderReadyForYou(data)},
      {key:'calendar', out: renderCalendar(data)},
      {key:'results', out: renderResults(data)},
      {key:'connections', out: renderConnections(data)},
      {key:'ideas', out: renderIdeas(data)},
      {key:'changes', out: renderChangeRequests(data)}
    ];
    document.getElementById('cc-main').innerHTML = '<div class="cc-loading">Loading real data&hellip;</div>';
    Promise.all(sections.map(function(s){
      return Promise.resolve(s.out).then(function(html){ return {key:s.key, html:html}; });
    })).then(function(built){
      document.getElementById('cc-main').innerHTML = built.map(function(s){
        return '<section class="cc-page-section" id="cc-section-' + s.key + '">' + s.html + '</section>';
      }).join('');
      if (navActive && navActive !== 'home') {
        var target = document.getElementById('cc-section-' + navActive);
        if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
  }

  function loadAndRender(){
    return api('command_center').then(function(r){
      if (!r || !r.ok) {
        document.getElementById('cc-main').innerHTML = '<div class="cc-empty">' + esc((r && r.error) || 'Could not load the Command Center. Try refreshing.') + '</div>';
        return;
      }
      STATE.data = r;
      render();
    }).catch(function(){
      document.getElementById('cc-main').innerHTML = '<div class="cc-empty">Could not reach the server. Check your connection and refresh.</div>';
    });
  }

  // ---------- Growth (Reina's ranked next steps) ----------
  // Every card here was computed from real synced numbers by the weekly scan
  // in api/growth.js and carries the evidence it came from. Accepting one
  // creates a DRAFT -- it never launches an ad, sends an email, or spends.
  function growthPriorityChip(p){
    if (p <= 1) return '<span class="cc-status ready">Do this first</span>';
    if (p === 2) return '<span class="cc-status pending">High value</span>';
    return '';
  }

  // Evidence is rendered from whatever scalar keys the suggestion carries
  // rather than a fixed list, because each rule contributes different fields
  // and a hardcoded template would silently drop the ones that matter most.
  function growthEvidenceHtml(evidence){
    return Object.keys(evidence || {}).map(function(k){
      var v = evidence[k];
      if (v == null || typeof v === 'object') return '';
      var label = k.replace(/([A-Z])/g, ' $1').replace(/^./, function(c){ return c.toUpperCase(); });
      var isMoney = /Cents$/.test(k);
      return '<div class="cc-ready-sub">' + esc(label.replace(/ Cents$/, '')) + ': ' +
        esc(isMoney ? money(Number(v) / 100) : String(v)) + '</div>';
    }).join('');
  }

  function growthCard(sug){
    return '<div class="cc-ready-card" data-growth-id="' + esc(sug.id) + '">' +
      '<div class="cc-icon-circle">' + icon('rocket') + '</div>' +
      growthPriorityChip(sug.priority) +
      '<div class="cc-ready-title">' + esc(sug.title) + '</div>' +
      '<div class="cc-ready-sub">' + esc(sug.rationale) + '</div>' +
      growthEvidenceHtml(sug.evidence) +
      '<button class="cc-btn cc-btn-primary" data-growth-act="accept">Do it</button>' +
      '<button class="cc-btn cc-btn-secondary" style="margin-top:8px;margin-left:8px;" data-growth-act="dismiss">Not now</button>' +
    '</div>';
  }

  function renderGrowth(){
    return apiGrowth('growth_suggestions&status=open').then(function(r){
      if (!r || !r.ok) {
        return '<h1 class="cc-h1">Growth</h1><div class="cc-card cc-empty">' + esc((r && r.error) || 'Could not load growth suggestions.') + '</div>';
      }
      var items = r.suggestions || [];
      var body = items.length
        ? '<div class="cc-ready-row">' + items.map(growthCard).join('') + '</div>'
        : '<div class="cc-card cc-empty">Nothing to recommend right now. Reina re-checks the numbers every Monday morning, and you can re-run the check below any time.</div>';
      return '<h1 class="cc-h1">Growth</h1>' +
        '<p class="cc-sub">What Reina thinks you should do next to grow, worked out from your real jobs, quotes, customers and ad spend &mdash; ranked by the money actually at stake. Accepting one creates a draft; nothing here spends money or reaches a customer on its own.</p>' +
        body +
        '<div style="margin-top:16px"><button class="cc-btn cc-btn-secondary" id="cc-growth-rescan">Re-check the numbers now</button></div>';
    });
  }

  // ---------- Paid Ads ----------
  // The paid-ads engine (api/ads.js) was complete and had no screen at all,
  // which is why no campaign was ever drafted in it. This is that screen:
  // connection state, real spend against the real cap, and the
  // draft -> approve -> launch -> pause path for real campaigns.
  var AD_NEXT_STATE = {
    not_connected: {to:'setup_incomplete', label:'Start connecting'},
    setup_incomplete: {to:'reporting_verified', label:'Reporting verified'},
    reporting_verified: {to:'draft_validated', label:'Drafts validated'},
    draft_validated: {to:'launch_enabled', label:'Enable launching'}
  };

  function adConnectionRow(c){
    var next = AD_NEXT_STATE[c.state];
    var status;
    if (c.state === 'launch_enabled') {
      status = '<span class="cc-status ready">' + icon('check') + ' Ready to launch</span>';
    } else if (c.isIssue) {
      status = '<span class="cc-status off">' + esc(c.state.replace(/_/g, ' ')) +
        (c.lastError ? '<span class="cc-status-sub">' + esc(c.lastError) + '</span>' : '') + '</span>';
    } else {
      status = '<span class="cc-status pending">' + esc(c.state.replace(/_/g, ' ')) + '</span>';
    }
    return '<div class="cc-conn-row" data-ad-platform="' + esc(c.platform) + '">' +
      '<div class="cc-conn-name">' + esc(c.label) + '</div>' +
      '<div class="cc-conn-state">' + status + '</div>' +
      (next ? '<button class="cc-btn cc-btn-secondary" data-ad-transition="' + esc(next.to) + '">' + esc(next.label) + '</button>' : '') +
    '</div>';
  }

  // One row of buttons per status, because the actions a campaign can take
  // are exactly the transitions its state machine allows -- offering the rest
  // greyed out would suggest the launch gate is softer than it is.
  function adCampaignActions(status){
    if (status === 'draft') {
      return '<button class="cc-btn cc-btn-primary" data-ad-camp="approve">Approve</button>' +
        '<button class="cc-btn cc-btn-secondary" style="margin-left:8px" data-ad-camp="reject">Reject</button>';
    }
    if (status === 'pending_review') return '<button class="cc-btn cc-btn-primary" data-ad-camp="launch">Launch for real</button>';
    if (status === 'active') {
      return '<button class="cc-btn cc-btn-secondary" data-ad-camp="pause">Pause</button>' +
        '<button class="cc-btn cc-btn-secondary" style="margin-left:8px" data-ad-camp="spend">Sync spend</button>';
    }
    return '';
  }

  function adCampaignCard(c){
    var copy = c.ad_copy || {};
    return '<div class="cc-card" data-ad-campaign="' + esc(c.id) + '" style="margin-bottom:12px">' +
      '<div class="cc-ready-title">' + esc(c.name) + '</div>' +
      '<div class="cc-ready-sub">' + esc(String(c.status).replace(/_/g, ' ')) + ' &middot; ' + money((c.daily_budget_cents || 0) / 100) + '/day</div>' +
      (copy.headline ? '<div class="cc-ready-sub" style="margin-top:8px"><b>' + esc(copy.headline) + '</b><br>' + esc(copy.primaryText || '') + '</div>' : '') +
      '<div style="margin-top:10px">' + adCampaignActions(c.status) + '</div>' +
    '</div>';
  }

  function renderPaidAds(){
    return Promise.all([apiAds('ad_connections'), apiAds('ad_campaigns')]).then(function(r){
      var connRes = r[0], campRes = r[1];
      if (!connRes || !connRes.ok) {
        return '<h1 class="cc-h1">Paid Ads</h1><div class="cc-card cc-empty">' + esc((connRes && connRes.error) || 'Could not load ad connections.') + '</div>';
      }
      var conns = connRes.connections || [];
      var camps = (campRes && campRes.ok && campRes.campaigns) || [];
      var live = conns.filter(function(c){ return c.state === 'launch_enabled'; }).length;
      var campHtml = camps.length
        ? camps.map(adCampaignCard).join('')
        : '<div class="cc-card cc-empty">No ad campaign has been drafted yet. Connect a platform above, then accept a Growth suggestion &mdash; Reina drafts the campaign for you.</div>';

      return '<h1 class="cc-h1">Paid Ads</h1>' +
        '<p class="cc-sub">Google Ads, Meta and TikTok. Every campaign is checked against your real monthly budget cap before it can be approved, and nothing goes live until you press Launch.</p>' +
        '<div class="cc-card"><h2 style="font-size:15px;margin:0 0 12px;color:var(--navy)">Ad accounts</h2>' +
          (live ? '' : '<div class="cc-empty" style="margin-bottom:10px">No ad account is connected yet, so no campaign can run. Connecting happens in your Google Ads and Meta accounts &mdash; mark each step here as you complete it.</div>') +
          conns.map(adConnectionRow).join('') +
        '</div>' +
        '<h2 style="font-size:15px;margin:26px 0 12px;color:var(--navy)">Campaigns</h2>' + campHtml;
    });
  }

  function ccSocialReview(postId, decision){
    var reason = null;
    if (decision === 'reject') {
      reason = (window.prompt('Optional: add a reason for rejecting this (or leave blank).') || '').trim();
      if (!window.confirm('Reject this draft? Reina will not publish it.')) return;
    }
    apiSocial('social_post_review', { method:'POST', body: JSON.stringify({ postId: postId, decision: decision, reason: reason || undefined }) })
      .then(function(r){
        if (!r || !r.ok) { window.alert((r && r.error) || 'Could not update this post.'); return; }
        render();
      }).catch(function(e){ window.alert('Could not update this post: ' + e.message); });
  }

  function ccSocialSchedule(postId){
    var when = window.prompt('Schedule for when? Example: 2026-08-06 09:00', '');
    if (!when) return;
    var d = new Date(when);
    if (isNaN(d.getTime())) { window.alert('Could not understand that date/time.'); return; }
    apiSocial('social_post_schedule', { method:'POST', body: JSON.stringify({ postId: postId, scheduledFor: d.toISOString() }) })
      .then(function(r){
        if (!r || !r.ok) { window.alert((r && r.error) || 'Could not schedule this post.'); return; }
        render();
      }).catch(function(e){ window.alert('Could not schedule this post: ' + e.message); });
  }

  function ccSocialPublish(postId){
    if (!window.confirm('Publish this right now, for real?')) return;
    apiSocial('social_post_publish', { method:'POST', body: JSON.stringify({ postId: postId }) })
      .then(function(r){
        if (!r || !r.ok) { window.alert((r && r.error) || 'Could not publish this post.'); return; }
        render();
      }).catch(function(e){ window.alert('Could not publish this post: ' + e.message); });
  }

  function ccGrowthDecide(id, decision){
    var reason = decision === 'dismiss' ? (window.prompt('Optional: why not now?') || '').trim() : null;
    return apiGrowth('growth_suggestion_decide', {method:'POST', body: JSON.stringify({suggestionId:id, decision:decision, reason: reason || undefined})})
      .then(function(r){
        if (!r || !r.ok) { window.alert((r && r.error) || 'Could not record that.'); return; }
        if (r.note) window.alert(r.note);
        render();
      }).catch(function(e){ window.alert('Could not record that: ' + e.message); });
  }

  function ccAdCampaignAction(campaignId, act){
    function done(r, failMsg){
      if (!r || !r.ok) { window.alert((r && r.error) || failMsg); return; }
      render();
    }
    if (act === 'approve' || act === 'reject') {
      var reason = act === 'reject' ? (window.prompt('Optional: why reject it?') || '').trim() : null;
      return apiAds('ad_campaign_review', {method:'POST', body: JSON.stringify({campaignId:campaignId, decision:act, reason: reason || undefined})})
        .then(function(r){ done(r, 'Could not update that campaign.'); });
    }
    if (act === 'launch') {
      if (!window.confirm('Launch this campaign for real? It will start spending money on the ad platform.')) return Promise.resolve();
      return apiAds('ad_campaign_launch', {method:'POST', body: JSON.stringify({campaignId:campaignId})})
        .then(function(r){ done(r, 'Could not launch that campaign.'); });
    }
    if (act === 'pause') {
      return apiAds('ad_campaign_pause', {method:'POST', body: JSON.stringify({campaignId:campaignId})})
        .then(function(r){ done(r, 'Could not pause that campaign.'); });
    }
    if (act === 'spend') {
      return apiAds('ad_spend_sync', {method:'POST', body: JSON.stringify({campaignId:campaignId})})
        .then(function(r){ done(r, 'Could not sync spend.'); });
    }
    return Promise.resolve();
  }

  document.addEventListener('click', function(e){
    var connectTrigger = e.target.closest && e.target.closest('.cc-connect-trigger');
    if (connectTrigger) { ccOpenConnectModal(connectTrigger.getAttribute('data-channel-key')); return; }
    var growthBtn = e.target.closest && e.target.closest('[data-growth-act]');
    if (growthBtn) {
      growthBtn.disabled = true;
      ccGrowthDecide(growthBtn.closest('[data-growth-id]').getAttribute('data-growth-id'), growthBtn.getAttribute('data-growth-act'));
      return;
    }
    if (e.target.id === 'cc-growth-rescan') {
      e.target.disabled = true;
      e.target.textContent = 'Checking the numbers...';
      apiGrowth('growth_scan').then(function(r){
        if (!r || !r.ok) window.alert((r && r.error) || 'Could not re-check the numbers.');
        render();
      });
      return;
    }
    var adTrans = e.target.closest && e.target.closest('[data-ad-transition]');
    if (adTrans) {
      adTrans.disabled = true;
      apiAds('ad_connection_transition', {method:'POST', body: JSON.stringify({
        platform: adTrans.closest('[data-ad-platform]').getAttribute('data-ad-platform'),
        toState: adTrans.getAttribute('data-ad-transition')
      })}).then(function(r){
        if (!r || !r.ok) window.alert((r && r.error) || 'Could not update that connection.');
        render();
      });
      return;
    }
    var adCamp = e.target.closest && e.target.closest('[data-ad-camp]');
    if (adCamp) {
      adCamp.disabled = true;
      ccAdCampaignAction(adCamp.closest('[data-ad-campaign]').getAttribute('data-ad-campaign'), adCamp.getAttribute('data-ad-camp'));
      return;
    }
    var btn = e.target.closest && e.target.closest('.cc-social-action');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var postId = btn.getAttribute('data-post-id');
    if (action === 'approve') ccSocialReview(postId, 'approve');
    else if (action === 'reject') ccSocialReview(postId, 'reject');
    else if (action === 'publish') ccSocialPublish(postId);
    else if (action === 'schedule') ccSocialSchedule(postId);
  });

  window.addEventListener('hashchange', render);
  loadAndRender();
})();
</script>
  <script src="/voice-input.js" defer></script>
</body>
