name: Report Dev To-Do failure

on:
  workflow_run:
    workflows: [Hardened completion gate]
    types: [completed]

permissions: {}

jobs:
  report-failure:
    # Green runs are deliberately absent from Dev To-Do.  This queue is only
    # for blockers a person needs to address.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Report the failed main-branch gate
        env:
          STATUS_HUB_INGEST_SECRET: ${{ secrets.STATUS_HUB_INGEST_SECRET }}
          STATUS_HUB_URL: https://hivelogic-live.vercel.app/api/status-hub-ingest
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          test -n "$STATUS_HUB_INGEST_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors \
            --request POST "$STATUS_HUB_URL" \
            --header "Authorization: Bearer $STATUS_HUB_INGEST_SECRET" \
            --header 'Content-Type: application/json' \
            --data "{\"source\":\"github_ci\",\"fingerprint\":\"github-${RUN_ID}\",\"title\":\"Main branch check failed — ${WORKFLOW_NAME}\",\"detail\":\"${RUN_URL}\",\"severity\":\"high\",\"workflow\":\"${WORKFLOW_NAME}\",\"run_id\":\"${RUN_ID}\"}"
