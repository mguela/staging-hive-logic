name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      migration_version:
        description: 'Exact 14-digit migration version to apply'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply production schema
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations introduced by this change
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || missing+=(SUPABASE_ACCESS_TOKEN)
          [[ -n "$SUPABASE_PROJECT_REF" ]] || missing+=(SUPABASE_PROJECT_REF)
          if (( ${#missing[@]} )); then
            echo "::error title=Supabase migrations are not configured::Missing production GitHub secret(s): ${missing[*]}. Add them under Settings > Secrets and variables > Actions before relying on automatic schema deployment."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]{14}$ ]] || {
              echo "::error::migration_version must be exactly 14 digits"
              exit 1
            }
            mapfile -t migration_files < <(find supabase/migrations -maxdepth 1 -type f -name "${REQUESTED_VERSION}_*.sql" -print)
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=2 origin main
              BEFORE_SHA="$(git rev-parse HEAD^)"
            fi
            mapfile -t migration_files < <(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$GITHUB_SHA" -- 'supabase/migrations/*.sql' | sort)
          fi

          if (( ${#migration_files[@]} == 0 )); then
            echo "No newly added migration is in this change. Nothing to apply."
            exit 0
          fi

          migration_list="$(supabase migration list --linked)"
          for migration_file in "${migration_files[@]}"; do
            [[ "$migration_file" =~ ^supabase/migrations/([0-9]{14})_[A-Za-z0-9_]+\.sql$ ]] || {
              echo "::error::Unsafe migration path: $migration_file"
              exit 1
            }
            version="${BASH_REMATCH[1]}"
            matches="$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l)"
            [[ "$matches" -eq 1 ]] || {
              echo "::error::Migration version $version is missing or duplicated"
              exit 1
            }

            if awk -F'|' -v wanted="$version" '
              {
                remote=$2
                gsub(/[^0-9]/, "", remote)
                if (remote == wanted) found=1
              }
              END { exit(found ? 0 : 1) }
            ' <<<"$migration_list"; then
              echo "Migration $version is already recorded as applied; skipping."
              continue
            fi

            # Last gate before this touches real rows. A migration that
            # executes destructive DML at apply time is refused unless it
            # states why a replay is harmless -- see the script's header, and
            # PR #198 for the case that motivated it. Refusing leaves the
            # migration unapplied, which is the recoverable direction.
            node scripts/check-migration-replay-safety.mjs "$migration_file"

            echo "Applying $migration_file"
            supabase db query --linked --file "$migration_file"
            supabase migration repair --status applied --linked "$version"
            migration_list="$(supabase migration list --linked)"
          done

          supabase migration list --linked
